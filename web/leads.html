<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELOR AI — Интерес</title>
<link href="vendor/inter.css" rel="stylesheet">
<style>
  /* Возможности — не «ещё один список», а ответ на один вопрос: с кем прямо
     сейчас можно заработать. Поэтому наверху открытые, а закрытые — за срезом.
     Вся раскладка (шапка, цифры, состояния, кнопки) берётся из velor.css;
     здесь только то, чего нет больше нигде: строка возможности и её карточка. */
  *{ margin:0; padding:0; box-sizing:border-box; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:rgba(128,82,255,.4); color:#fff; }
  .num{ font-variant-numeric:tabular-nums; }

  .tools{ display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap;
    margin:var(--sp-8) 0 var(--sp-5); }

  /* строка возможности */
  .lead-row{ border-bottom:1px solid var(--hairline); }
  .lead-row .top{ display:grid; grid-template-columns:1fr auto; gap:var(--sp-4);
    align-items:center; padding:var(--sp-4) 0; min-height:64px; cursor:pointer;
    transition:background var(--dur), padding-left var(--dur); }
  .lead-row .top:hover{ background:linear-gradient(90deg,var(--tint-iris),transparent 70%);
    padding-left:12px; }
  .lead-row .nm{ font-weight:var(--fw-reg); font-size:var(--fs-base); letter-spacing:-.01em; }
  .lead-row .meta{ margin-top:3px; font-weight:var(--fw-thin); font-size:var(--fs-sm);
    color:var(--ash); }
  .lead-row .rt{ text-align:right; white-space:nowrap; display:flex;
    flex-direction:column; align-items:flex-end; gap:4px; }
  .lead-row .sum{ font-size:var(--fs-body); color:var(--verdant); }
  .lead-row .sum.none{ color:var(--ash); font-size:var(--fs-sm); }
  .chev{ display:inline-block; width:0; height:0; margin-left:8px; vertical-align:middle;
    border:4px solid transparent; border-top-color:var(--ash);
    transition:transform var(--dur); }
  .lead-row.open .chev{ transform:rotate(180deg); }

  /* состояние: точка + слово, а не только цвет */
  .st{ display:inline-flex; align-items:center; gap:7px; font-weight:var(--fw-med);
    font-size:var(--fs-caption); padding:5px 12px; border-radius:var(--r-pill);
    background:var(--surface-2); white-space:nowrap; }
  .st i{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
  .st.new{ color:var(--lilac); }
  .st.qualified{ color:var(--ink-iris); }
  .st.in_progress{ color:var(--saffron); }
  .st.won{ color:var(--verdant); }
  .st.lost{ color:var(--ash); }

  /* приоритет: слово плюс цвет, никогда один цвет.
     Он отвечает не «сколько баллов», а «смотреть ли сюда сейчас». */
  .pri{ display:inline-flex; align-items:center; gap:7px; font-weight:var(--fw-semi);
    font-size:var(--fs-caption); letter-spacing:.06em; padding:5px 12px;
    border-radius:var(--r-pill); white-space:nowrap; text-transform:uppercase; }
  .pri i{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
  .pri.urgent{ color:var(--coral); background:rgba(255,107,107,.14); }
  .pri.high{ color:var(--saffron); background:rgba(255,184,41,.12); }
  .pri.medium{ color:var(--lilac); background:var(--tint-iris); }
  .pri.low{ color:var(--ash); background:var(--surface-2); }
  .waiting{ font-size:var(--fs-caption); color:var(--coral); }

  /* оценка в карточке: четыре ответа и причины под каждым */
  .q{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-4);
    padding:var(--sp-4) 0 var(--sp-5); border-bottom:1px solid var(--hairline);
    margin-bottom:var(--sp-5); }
  @media(max-width:760px){ .q{ grid-template-columns:1fr; } }
  .q .k{ font-weight:var(--fw-semi); font-size:var(--fs-micro); letter-spacing:.16em;
    text-transform:uppercase; color:var(--ash); }
  .q .v{ font-weight:var(--fw-reg); font-size:var(--fs-h3); letter-spacing:-.02em;
    margin-top:6px; }
  .q .v.est{ color:var(--saffron); }
  .q ul{ list-style:none; margin-top:var(--sp-3); display:flex;
    flex-direction:column; gap:5px; }
  .q li{ font-size:var(--fs-sm); font-weight:var(--fw-thin); color:var(--silver);
    padding-left:16px; position:relative; line-height:1.4; }
  .q li::before{ content:'✓'; position:absolute; left:0; color:var(--verdant);
    font-size:var(--fs-caption); top:2px; }
  .q li.no::before{ content:'—'; color:var(--ash); }

  /* что делать сейчас — самая крупная строка карточки */
  .act{ display:flex; align-items:flex-start; gap:var(--sp-3);
    padding:var(--sp-4); border-radius:var(--r-lg); background:var(--surface);
    border:1px solid var(--hairline); margin-bottom:var(--sp-4); }
  .act.hot{ border-color:rgba(255,107,107,.35); background:rgba(255,107,107,.06); }
  .act .t{ font-weight:var(--fw-med); font-size:var(--fs-base); }
  .act .d{ font-size:var(--fs-sm); font-weight:var(--fw-thin); color:var(--silver);
    margin-top:3px; }
  .risk{ margin-top:var(--sp-3); font-size:var(--fs-sm); color:var(--saffron); }

  /* касание: готовый текст и повод, по которому он написан.
     Отдельного экрана у касаний нет: решение принимается там же, где смотрят
     на возможность, — иначе владелец читал бы про клиента в одном месте, а
     решал про него в другом. */
  .fu{ border:1px solid var(--hairline); border-radius:var(--r-lg);
    background:var(--surface); padding:var(--sp-4); margin-bottom:var(--sp-4); }
  .fu.hot{ border-color:rgba(128,82,255,.35); background:var(--tint-iris); }
  .fu.done{ border-color:rgba(47,212,178,.28); }
  .fu.stopped{ background:transparent; }
  .fu .k{ font-weight:var(--fw-semi); font-size:var(--fs-micro); letter-spacing:.16em;
    text-transform:uppercase; color:var(--ash); }
  .fu .k.done{ color:var(--verdant); }
  .fu .k.stopped{ color:var(--ash); }
  .fu .t{ font-weight:var(--fw-med); font-size:var(--fs-base); margin-top:6px; }
  .fu ul{ list-style:none; margin-top:var(--sp-2); display:flex;
    flex-direction:column; gap:4px; }
  .fu li{ font-size:var(--fs-sm); font-weight:var(--fw-thin); color:var(--silver);
    padding-left:14px; position:relative; line-height:1.45; }
  .fu li::before{ content:'·'; position:absolute; left:2px; color:var(--ash); }
  .fu textarea{ width:100%; margin-top:var(--sp-3); min-height:88px;
    background:var(--surface-2); border:1px solid var(--hairline);
    border-radius:var(--r-sm); padding:12px 14px; color:var(--bone);
    font-family:inherit; font-weight:var(--fw-thin); font-size:var(--fs-base);
    line-height:1.5; resize:vertical; }
  .fu textarea:focus{ outline:none; border-color:var(--ring); background:var(--tint-iris); }
  .fu .said{ margin-top:var(--sp-3); padding:12px 14px; border-radius:var(--r-sm);
    background:var(--surface-2); font-size:var(--fs-body);
    font-weight:var(--fw-thin); line-height:1.5; }
  .fu .acts{ display:flex; gap:var(--sp-2); flex-wrap:wrap; align-items:center;
    margin-top:var(--sp-3); }
  .fu .note{ font-size:var(--fs-caption); color:var(--ash); margin-top:var(--sp-2); }
  .fu .note.warn{ color:var(--saffron); }

  /* одна строка в списке — и ни одной колонки больше */
  .fu-line{ margin-top:3px; font-size:var(--fs-caption); color:var(--ink-iris); }
  .fu-line.off{ color:var(--ash); }
  .fu-line.done{ color:var(--ink-verdant); }

  /* раскрытая карточка */
  .card{ display:none; padding:0 0 var(--sp-6); }
  .lead-row.open .card{ display:block; }
  .card .fields{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4);
    margin-bottom:var(--sp-4); }
  @media(max-width:640px){ .card .fields{ grid-template-columns:1fr; } }
  .f label{ display:block; font-size:var(--fs-caption); color:var(--ash);
    margin-bottom:6px; }
  .f input, .f select, .f textarea{ width:100%; min-height:44px; background:var(--surface-2);
    border:1px solid var(--hairline); border-radius:var(--r-sm); padding:10px 14px;
    color:var(--bone); font-family:inherit; font-weight:var(--fw-thin); font-size:var(--fs-base); }
  .f textarea{ resize:vertical; }
  .f input:focus, .f select:focus, .f textarea:focus{ outline:none;
    border-color:var(--ring); background:var(--tint-iris); }
  .f .hint{ font-size:var(--fs-caption); color:var(--ash); margin-top:5px; }
  .card-acts{ display:flex; gap:var(--sp-2); flex-wrap:wrap; align-items:center; }
  .card-acts .sub{ font-size:var(--fs-sm); color:var(--ash); }

  /* догадки ИИ — отдельно и подписанные: они не факт */
  .guess{ margin-top:var(--sp-4); border-left:2px solid var(--saffron);
    padding:var(--sp-3) var(--sp-4); background:rgba(255,184,41,.06);
    border-radius:0 var(--r-sm) var(--r-sm) 0; }
  .guess .h{ font-weight:var(--fw-med); font-size:var(--fs-sm); color:var(--saffron); }
  .guess .d{ font-size:var(--fs-sm); color:var(--silver); margin-top:4px; }

  .why{ margin-top:var(--sp-3); font-size:var(--fs-sm); color:var(--ash); }
  .why b{ color:var(--silver); font-weight:var(--fw-reg); }

  /* переписка, из которой выросла возможность */
  .chat{ margin-top:var(--sp-5); }
  .chat .h{ font-weight:var(--fw-semi); font-size:var(--fs-micro); letter-spacing:.16em;
    text-transform:uppercase; color:var(--ash); margin-bottom:var(--sp-3); }
  .chat .scroll{ max-height:260px; overflow-y:auto; display:flex;
    flex-direction:column; gap:var(--sp-2); }
  /* «Что делал VELOR» — те же записи, что и в общем журнале, но только про
     этого человека. Владелец не должен уходить в другой раздел, чтобы понять,
     почему по возможности что-то произошло или не произошло. */
  .did{ margin-top:var(--sp-4); }
  .did .h{ font-size:var(--fs-caption); letter-spacing:.1em; text-transform:uppercase;
    color:var(--ash); margin-bottom:var(--sp-3); }
  .did .a{ display:flex; gap:10px; align-items:baseline; padding:8px 0;
    border-bottom:1px solid var(--hairline); }
  .did .a:last-child{ border-bottom:none; }
  .did .a i{ font-style:normal; width:7px; height:7px; border-radius:50%;
    background:var(--ash); flex:none; transform:translateY(-2px); }
  .did .a.ok i{ background:var(--verdant); }
  .did .a.no i{ background:var(--coral); }
  .did .a.wait i{ background:var(--saffron); }
  .did .a .t{ font-size:var(--fs-body); color:var(--bone); }
  .did .a .d{ font-size:var(--fs-caption); color:var(--ash); line-height:1.45;
    margin-top:2px; }

  .msg{ padding:10px 14px; border-radius:var(--r-md); background:var(--surface-2);
    font-size:var(--fs-body); font-weight:var(--fw-thin); }
  .msg.user{ background:var(--tint-iris); }
  .msg .who{ display:block; font-size:var(--fs-caption); color:var(--ash);
    margin-bottom:3px; }

  /* форма «встретил человека» */
  .add{ display:none; border:1px solid var(--hairline); border-radius:var(--r-lg);
    background:var(--surface); padding:var(--sp-5); margin-bottom:var(--sp-6); }
  .add.on{ display:block; }
  .add .fields{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4);
    margin-bottom:var(--sp-4); }
  @media(max-width:640px){ .add .fields{ grid-template-columns:1fr; } }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:var(--sheet); border:1px solid var(--hairline-2); border-radius:var(--r-pill);
    padding:12px 22px; font-size:var(--fs-body); box-shadow:var(--shadow-pop);
    opacity:0; pointer-events:none; transition:opacity var(--dur), transform var(--dur);
    z-index:80; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<body>

<main>
  <header class="v-head">
    <div>
      <h1>Интерес</h1>
      <p class="v-lead">Люди, которые проявили интерес, но ещё ничего не купили.
        VELOR замечает их сам — в боте и в директе, — а вы отмечаете, чем
        закончилось. Из этих отметок и складывается конверсия.</p>
      <div class="v-state" id="state" aria-live="polite">
        <span class="v-badge calm"><i></i>Считаю воронку…</span>
      </div>
    </div>
    <div class="v-acts">
      <button class="v-btn" type="button" id="addBtn">Встретил человека</button>
    </div>
  </header>

  <div class="v-kpi" id="kpi" aria-live="polite">
    <div class="v-sk"></div><div class="v-sk"></div><div class="v-sk"></div><div class="v-sk"></div>
  </div>

  <!-- возможность руками: без выдуманного сообщения от клиента -->
  <section class="add" id="add" aria-label="Новая возможность">
    <div class="fields">
      <div class="f" style="grid-column:1/-1">
        <label for="nTitle">Чего хочет человек</label>
        <input id="nTitle" placeholder="Свадебный букет для Анны" autocomplete="off">
      </div>
      <div class="f">
        <label for="nValue">Сумма</label>
        <input id="nValue" type="text" inputmode="numeric" placeholder="если её назвали">
        <div class="hint">Пусто — значит «не знаем». Ноль здесь не то же самое.</div>
      </div>
      <div class="f">
        <label for="nClient">Клиент</label>
        <select id="nClient"><option value="">— пока не в базе —</option></select>
      </div>
      <div class="f" style="grid-column:1/-1">
        <label for="nInterest">Подробности</label>
        <textarea id="nInterest" rows="2" placeholder="Что именно нужно, к какой дате, что обсуждали"></textarea>
      </div>
    </div>
    <div class="card-acts">
      <button class="v-btn" type="button" id="nSave">Записать</button>
      <button class="v-btn ghost" type="button" id="nCancel">Отмена</button>
    </div>
  </section>

  <div class="tools">
    <div class="v-segs" id="segs" role="group" aria-label="Срез воронки">
      <button class="v-seg" data-seg="open" aria-pressed="true">В работе</button>
      <button class="v-seg" data-seg="" aria-pressed="false">Все</button>
      <button class="v-seg" data-seg="won" aria-pressed="false">Купили</button>
      <button class="v-seg" data-seg="lost" aria-pressed="false">Не сложилось</button>
    </div>
  </div>

  <div id="failZone" role="alert"></div>
  <p class="found" id="found" style="font-size:var(--fs-sm); color:var(--ash); min-height:20px; margin-bottom:var(--sp-3)"></p>
  <div id="list"><div class="v-sk row"></div><div class="v-sk row"></div><div class="v-sk row"></div></div>
  <button class="v-btn ghost" id="more" style="display:none; margin-top:var(--sp-5)">Показать ещё</button>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script src="panel-auth.js"></script>
<script src="nav.js"></script>
<script src="velor-field.js?v=19"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n) || 0).toLocaleString('ru-RU') + ' ₽';
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  return b === 1 ? one : many;
};
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

const PAGE = 50;
const listEl = document.getElementById('list');
const moreEl = document.getElementById('more');
const foundEl = document.getElementById('found');
const failEl = document.getElementById('failZone');
let segment = 'open', offset = 0, total = 0, loading = false;
let DICT = { statuses: [], reasons: [], sources: [], levels: {} };

function statusTitle(key){
  const s = DICT.statuses.find(x => x.key === key);
  return s ? s.title : key;
}

// ── состояние экрана: одна строка, объясняющая воронку целиком ──
function paintState(d){
  const box = document.getElementById('state');
  const s = d.stats || {};
  if (!s.total){
    box.innerHTML = '<span class="v-badge calm"><i></i>Возможностей пока нет</span>' +
      '<span>они появятся сами, когда клиент спросит цену или захочет записаться</span>';
    return;
  }
  const cls = s.attention ? 'warn' : (s.open ? 'good' : 'calm');
  const word = s.attention
    ? s.attention + ' ' + plural(s.attention, 'требует внимания', 'требуют внимания',
                                 'требуют внимания')
    : (s.open ? 'Ничего срочного' : 'Открытых нет');
  // Сводка по касаниям живёт здесь, а не на отдельной странице аналитики:
  // это те же возможности, посчитанные с другой стороны, и разводить их по
  // разным экранам значило бы предложить владельцу сверять их самому.
  const f = s.followup || {};
  const fuBits = [];
  const waiting = (f.scheduled || 0) + (f.approved || 0);
  if (f.ready) fuBits.push(f.ready + ' ' + plural(f.ready, 'касание готово',
                                                  'касания готовы', 'касаний готово'));
  if (waiting) fuBits.push(waiting + ' запланировано');
  if (f.blocked) fuBits.push(f.blocked + ' остановлено');
  const tail = [
    s.open + ' ' + plural(s.open, 'в работе', 'в работе', 'в работе'),
    s.closed ? 'конверсия ' + s.conversion + '%' : 'закрытых пока нет',
    fuBits.join(', '),
  ].filter(Boolean).join(' · ');
  box.innerHTML = '<span class="v-badge ' + cls + '"><i></i>' + word + '</span><span>' + esc(tail) + '</span>';
}

function paintKpi(d){
  const s = d.stats || {};
  // Первая цифра — не «сколько всего», а «сколько ждёт сейчас»: ради этого
  // ответа страницу и открывают.
  const cards = [
    ['Требуют внимания', s.attention || 0,
     s.waiting ? s.waiting + ' ждут ответа' : 'все вопросы отвечены',
     (s.attention ? 'hot' : '')],
    ['В работе', s.open, s.new ? s.new + ' ещё не трогали' : 'все в работе'],
    ['Купили', s.won, s.closed ? 'из ' + s.closed + ' закрытых' : 'закрытых пока нет'],
    ['Конверсия', s.closed ? s.conversion + '%' : '—',
     s.closed ? 'считается по закрытым' : 'отметьте исход хотя бы одной'],
  ];
  document.getElementById('kpi').innerHTML = cards.map(([k, v, sub, cls]) =>
    '<div class="v-kpi-card">' +
      '<div class="k">' + k + '</div>' +
      '<div class="v num"' + (cls === 'hot' ? ' style="color:var(--saffron)"' : '') + '>' +
        (typeof v === 'number' ? v.toLocaleString('ru-RU') : esc(v)) + '</div>' +
      '<div class="s">' + esc(sub) + '</div>' +
    '</div>').join('');
}

function rowMeta(l){
  const bits = [];
  if (l.client_name) bits.push(esc(l.client_name));
  if (l.source_ru) bits.push(esc(l.source_ru));
  if (l.created_at) bits.push(esc(String(l.created_at).slice(0, 10)));
  if (l.lost_reason_ru) bits.push('причина: ' + esc(l.lost_reason_ru));
  return bits.join(' · ');
}

// Касание в строке списка — ровно одна строка. Владельцу здесь нужно знать
// только, ждёт ли его решение и когда уйдёт сообщение; всё остальное он
// прочитает, когда откроет карточку.
function fuLine(f){
  if (!f) return '';
  if (f.status === 'sent'){
    return '<div class="fu-line done">касание отправлено' +
      (f.sent_at ? ' ' + esc(when(f.sent_at)) : '') +
      (f.outcome_ru ? ' · ' + esc(f.outcome_ru) : '') + '</div>';
  }
  if (f.status === 'blocked' || f.status === 'failed'){
    return '<div class="fu-line off">касание остановлено' +
      (f.stop_ru || f.error ? ': ' + esc(f.stop_ru || f.error) : '') + '</div>';
  }
  // Отменённое в списке не показываем: владелец сам сказал «не писать», и
  // напоминать ему об этом в каждой строке — не информация, а укор.
  if (f.status === 'cancelled') return '';
  if (f.status === 'scheduled'){
    return '<div class="fu-line">касание уйдёт ' + esc(when(f.recommended_at)) + '</div>';
  }
  if (f.status === 'approved'){
    return '<div class="fu-line">касание разрешено — уйдёт в рабочее время</div>';
  }
  return '<div class="fu-line">касание готово — ждёт вашего слова</div>';
}

// Дату показываем словами, а не строкой из базы: «сегодня в 18:00» человек
// читает мгновенно, «2026-08-29 18:00:00» — нет.
function when(raw){
  if (!raw) return '';
  const s = String(raw).replace(' ', 'T') + 'Z';
  const d = new Date(s);
  if (isNaN(d)) return String(raw).slice(0, 16);
  const now = new Date();
  const time = d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return 'сегодня в ' + time;
  const tom = new Date(now.getTime() + 86400000);
  if (d.toDateString() === tom.toDateString()) return 'завтра в ' + time;
  return d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'}) + ' в ' + time;
}

function leadHTML(l){
  const q = l.q || {};
  // Деньги показываем и оценочные — но подписью «≈», чтобы их нельзя было
  // спутать с суммой, которую человек назвал сам.
  const sum = l.value ? '<span class="sum num">' + money(l.value) + '</span>'
    : (q.money ? '<span class="sum num est" style="color:var(--saffron)">≈ ' + money(q.money) + '</span>'
               : '<span class="sum none">сумму не называли</span>');
  return '' +
    '<div class="lead-row" data-id="' + l.id + '">' +
      '<div class="top" role="button" tabindex="0" aria-expanded="false">' +
        '<div>' +
          '<div class="nm">' + (esc(l.title) || 'Возможность') + '<span class="chev" aria-hidden="true"></span></div>' +
          '<div class="meta">' + rowMeta(l) + '</div>' +
          (q.unanswered && l.open
            ? '<div class="waiting">ждёт ответа' + (q.waiting_ru ? ' ' + esc(q.waiting_ru) : '') + '</div>'
            : '') +
          fuLine(l.f) +
        '</div>' +
        '<div class="rt">' +
          (l.open && q.priority
            ? '<span class="pri ' + esc(q.priority) + '"><i></i>' + esc(q.priority_ru) + '</span>'
            : '<span class="st ' + esc(l.status) + '"><i></i>' + esc(l.status_ru) + '</span>') +
          sum +
        '</div>' +
      '</div>' +
      '<div class="card" data-loaded="0"><div class="v-sk row"></div></div>' +
    '</div>';
}

// Оценка возможности: четыре ответа и причина под каждым. Причина обязательна —
// без неё это был бы тот самый непрозрачный балл, ради отказа от которого всё
// и затевалось.
function qHTML(l){
  const q = l.q || {};
  if (!q.priority) return '';
  const li = (arr, cls) => (arr || []).slice(0, 4)
    .map(x => '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(x) + '</li>').join('');

  const action = q.action
    ? '<div class="act' + (q.priority === 'urgent' || q.priority === 'high' ? ' hot' : '') + '">' +
        '<span class="pri ' + esc(q.priority) + '"><i></i>' + esc(q.priority_ru) + '</span>' +
        '<div><div class="t">' + esc(q.action) + '</div>' +
        '<div class="d">' + esc(q.action_hint || '') + '</div></div>' +
      '</div>'
    : '';

  const risks = (q.risks || []).length
    ? '<div class="risk">' + (q.risks || []).map(esc).join(' · ') + '</div>' : '';

  const moneyLine = q.money
    ? '<div class="v' + (q.money_estimated ? ' est' : '') + '">' +
        (q.money_estimated ? '≈ ' : '') + money(q.money) + '</div>' +
      '<ul><li' + (q.money_estimated ? ' class="no"' : '') + '>' +
        esc(q.money_src || '') + '</li>' +
        (q.money_estimated ? '<li class="no">это наша оценка, а не слова клиента</li>' : '') +
        (q.wanted_at ? '<li>нужно к ' + esc(q.wanted_at) + '</li>' : '') + '</ul>'
    : '<div class="v" style="color:var(--ash)">не знаем</div>' +
      '<ul><li class="no">сумму никто не называл — придумывать её нельзя</li>' +
      (q.wanted_at ? '<li>нужно к ' + esc(q.wanted_at) + '</li>' : '') + '</ul>';

  return action + risks +
    '<div class="q">' +
      '<div><div class="k">Хочет купить</div>' +
        '<div class="v">' + esc(q.intent_ru) + '</div>' +
        '<ul>' + li(q.intent_why) + '</ul></div>' +
      '<div><div class="k">Наше ли это</div>' +
        '<div class="v">' + esc(q.fit_ru) + '</div>' +
        '<ul>' + li(q.fit_why, q.fit === 'unknown' || q.fit === 'low' ? 'no' : '') + '</ul></div>' +
      '<div><div class="k">Деньги</div>' + moneyLine + '</div>' +
    '</div>';
}

// Касание в карточке. Владелец должен за пять секунд понять три вещи:
// почему мы вообще пишем, что именно будет написано и что случится, если он
// ничего не сделает. Всё остальное — подробности.
function fuHTML(d){
  const list = d.followups || [];
  const live = list.filter(f => f.live);
  const f = live.length ? live[live.length - 1]
                        : (list.length ? list[list.length - 1] : null);
  const open = (d.lead || {}).open;

  if (!f){
    return open
      ? '<div class="fu"><div class="k">Касание</div>' +
          '<div class="t">Повода написать сейчас нет</div>' +
          '<ul><li>VELOR предлагает написать, только когда есть настоящее ' +
          'событие: клиент ждёт ответа, не ответил на предложение или назвал ' +
          'дату. Придумывать повод он не будет.</li></ul>' +
          '<div class="acts"><button class="v-btn ghost fu-plan" type="button">' +
          'Проверить сейчас</button></div></div>'
      : '';
  }

  const why = (f.why || []).map(x => '<li>' + esc(x) + '</li>').join('');
  const attempt = '<li>' + esc(f.attempt_ru) + '</li>';

  if (f.status === 'sent'){
    return '<div class="fu done"><div class="k done">Отправлено ' +
        esc(when(f.sent_at)) + '</div>' +
      '<div class="said">' + esc(f.message || '') + '</div>' +
      '<ul><li>повод: ' + esc(f.reason_ru) + '</li>' + attempt +
        (f.outcome_ru ? '<li>чем кончилось: ' + esc(f.outcome_ru) + '</li>'
                      : '<li>ответа пока нет</li>') + '</ul></div>';
  }

  if (f.status === 'blocked' || f.status === 'failed' || f.status === 'cancelled'){
    const head = f.status === 'failed' ? 'Не отправилось' :
                 f.status === 'cancelled' ? 'Отменено' : 'Не отправляем';
    return '<div class="fu stopped"><div class="k stopped">' + head + '</div>' +
      '<div class="t">' + esc(f.stop_ru || f.error || 'причина не записана') + '</div>' +
      '<ul><li>повод был: ' + esc(f.reason_ru) + '</li>' + attempt + '</ul>' +
      (f.message ? '<div class="said">' + esc(f.message) + '</div>' : '') + '</div>';
  }

  // Живое касание: черновик, одобренное или запланированное.
  const state = f.status === 'scheduled'
    ? 'уйдёт само ' + when(f.recommended_at)
    : f.status === 'approved'
      ? 'вы разрешили — уйдёт в рабочее время'
      : 'ждёт вашего слова: сам VELOR это сообщение не отправит';
  // Почему текст такой, какой есть. «Модель не подключена» — это просто факт
  // о настройке, а вот «модель назвала цену, которой нет в памяти» — это уже
  // предупреждение: оно показывает, чего в памяти бизнеса не хватает.
  const rej = f.model_rejected || [];
  const onlyOff = rej.length === 1 && /не подключена|не ответила/.test(rej[0]);
  const flagged = !rej.length ? ''
    : onlyOff
      ? '<div class="note">Текст собран из фактов разговора: ' + esc(rej[0]) + '.</div>'
      : '<div class="note warn">Модель написала свой вариант, но он не ушёл: ' +
        esc(rej.join('; ')) + '. Здесь текст без этих утверждений — по нему ' +
        'видно, чего не хватает в памяти бизнеса.</div>';

  return '<div class="fu hot" data-fu="' + f.id + '">' +
      '<div class="k">Касание</div>' +
      '<div class="t">' + esc(f.reason_ru) + '</div>' +
      '<ul>' + why + attempt + '<li>' + esc(state) + '</li></ul>' +
      '<textarea class="fu-text" aria-label="Текст сообщения">' + esc(f.message || '') + '</textarea>' +
      '<div class="acts">' +
        '<button class="v-btn fu-send" type="button">Отправить</button>' +
        '<button class="v-btn ghost fu-save" type="button">Сохранить текст</button>' +
        (f.status === 'draft'
          ? '<button class="v-btn ghost fu-later" type="button">Отправить позже</button>' : '') +
        '<button class="v-btn ghost fu-stop" type="button">Не писать</button>' +
      '</div>' + flagged +
    '</div>';
}

function cardHTML(d){
  const l = d.lead;
  const statusOpts = DICT.statuses.map(s =>
    '<option value="' + s.key + '"' + (s.key === l.status ? ' selected' : '') + '>' + esc(s.title) + '</option>').join('');
  const reasonOpts = ['<option value="">— причина —</option>'].concat(DICT.reasons.map(r =>
    '<option value="' + r.key + '"' + (r.key === l.lost_reason ? ' selected' : '') + '>' + esc(r.title) + '</option>')).join('');

  // Догадку показываем словами, а не именами колонок: «value: 6000» человек
  // читает как ошибку системы, а не как предположение о его деньгах.
  const FIELD_RU = {title: 'чего хочет', interest: 'подробности',
                    value: 'сумма', currency: 'валюта', status: 'состояние',
                    lost_reason: 'причина', client_id: 'клиент', source: 'источник',
                    intent: 'намерение', fit: 'соответствие', priority: 'приоритет'};
  const LV = DICT.levels || {intent: [], fit: [], priority: []};
  const lvOpts = (list, cur) => ['<option value="">— считает VELOR —</option>']
    .concat((list || []).map(o =>
      '<option value="' + o.key + '"' + (o.key === cur ? ' selected' : '') + '>' +
      esc(o.title) + '</option>')).join('');
  const guessKeys = Object.keys(d.lead.guess || {});
  const guessHTML = guessKeys.length
    ? '<div class="guess"><div class="h">VELOR предполагает — но это не факт</div>' +
      '<div class="d">' + guessKeys.map(k =>
        esc(FIELD_RU[k] || k) + ' — ' + esc(String(d.lead.guess[k]))).join(' · ') +
      '. В карточку это не записано: в неё попадает только сказанное вслух.</div></div>'
    : '';

  const whyHTML = (l.why && l.why.length)
    ? '<div class="why"><b>Почему это возможность:</b> ' + esc(l.why.join(', ')) + '</div>' : '';

  const orderHTML = d.order
    ? '<div class="why"><b>Стало заявкой:</b> №' + d.order.id + ' — ' + esc(d.order.text || '') +
      (d.order.amount ? ' · ' + money(d.order.amount) : '') + '</div>' : '';

  // Что делал VELOR по этой возможности — включая то, чего ему не дали
  // сделать: сработавшая защита без объяснения выглядит как поломка.
  const acts = d.actions || [];
  const actsHTML = acts.length
    ? '<div class="did"><div class="h">Что делал VELOR</div>' +
      acts.map(a => {
        const cls = a.status === 'succeeded' ? 'ok'
                  : (a.status === 'blocked' || a.status === 'failed' ? 'no'
                     : (a.waiting ? 'wait' : ''));
        const tail = a.result || a.error || '';
        return '<div class="a ' + cls + '"><i></i><span>' +
          '<span class="t">' + esc(a.title) + ' — ' + esc(a.status_ru) + '</span>' +
          (a.reason ? '<span class="d">' + esc(a.reason) + '</span>' : '') +
          (tail ? '<span class="d">' + esc(tail) + '</span>' : '') +
          '</span></div>';
      }).join('') + '</div>'
    : '';

  const msgs = d.messages || [];
  const chatHTML = msgs.length
    ? '<div class="chat"><div class="h">Разговор, из которого это выросло</div><div class="scroll">' +
      msgs.map(m => '<div class="msg ' + (m.role === 'user' ? 'user' : 'assistant') + '">' +
        '<span class="who">' + (m.role === 'user' ? 'клиент' : 'сотрудник') + '</span>' +
        esc(m.content) + '</div>').join('') + '</div></div>'
    : '';

  const ownerNote = (l.owner_fields || []).length
    ? '<div class="why">Ваши правки VELOR не переписывает: ' +
      esc(l.owner_fields.map(k => FIELD_RU[k] || k).join(', ')) + '.</div>'
    : '';

  const owned = new Set(l.owner_fields || []);
  return '' +
    qHTML(l) +
    fuHTML(d) +
    '<div class="fields">' +
      '<div class="f" style="grid-column:1/-1"><label>Чего хочет человек</label>' +
        '<input name="title" value="' + esc(l.title) + '"></div>' +
      '<div class="f"><label>Состояние</label><select name="status">' + statusOpts + '</select></div>' +
      '<div class="f"><label>Сумма</label>' +
        '<input name="value" inputmode="numeric" value="' + (l.value || '') + '">' +
        '<div class="hint">Пусто — значит «не знаем».</div></div>' +
      '<div class="f"><label>Почему не сложилось</label><select name="lost_reason">' + reasonOpts + '</select></div>' +
      '<div class="f"><label>Клиент</label>' +
        '<input value="' + esc(l.client_name || 'не привязан') + '" disabled></div>' +
      '<div class="f" style="grid-column:1/-1"><label>Подробности</label>' +
        '<textarea name="interest" rows="2">' + esc(l.interest || '') + '</textarea></div>' +
      // Оценку можно поправить рукой: владелец знает про клиента то, чего нет
      // ни в одном сообщении. После правки правила это поле не пересчитывают.
      '<div class="f"><label>Хочет купить</label>' +
        '<select name="intent">' + lvOpts(LV.intent, owned.has('intent') ? l.intent : '') + '</select></div>' +
      '<div class="f"><label>Наше ли это</label>' +
        '<select name="fit">' + lvOpts(LV.fit, owned.has('fit') ? l.fit : '') + '</select></div>' +
      '<div class="f"><label>Приоритет</label>' +
        '<select name="priority">' + lvOpts(LV.priority, owned.has('priority') ? l.priority : '') + '</select>' +
        '<div class="hint">Пусто — считает VELOR, заново при каждом открытии.</div></div>' +
    '</div>' +
    '<div class="card-acts">' +
      '<button class="v-btn save" type="button">Сохранить</button>' +
      '<button class="v-btn ghost won" type="button">Купил</button>' +
      '<button class="v-btn ghost lost" type="button">Не сложилось</button>' +
    '</div>' +
    ownerNote + whyHTML + orderHTML + guessHTML + actsHTML + chatHTML;
}

async function loadCard(el){
  const box = el.querySelector('.card');
  if (box.dataset.loaded === '1') return;
  const id = el.dataset.id;
  try{
    const r = await fetch('/api/leads/' + id);
    if (!r.ok) throw 0;
    const d = await r.json();
    DICT = { statuses: d.statuses || DICT.statuses, reasons: d.reasons || DICT.reasons,
             sources: d.sources || DICT.sources, levels: d.levels || DICT.levels };
    box.innerHTML = cardHTML(d);
    box.dataset.loaded = '1';
    // Запоминаем состояние, с которым карточку открыли: сравнивать его с
    // содержимым строки нельзя — там теперь стоит приоритет, а не состояние.
    box.dataset.status = d.lead.status || '';
    wireCard(el, box);
  }catch{
    box.innerHTML = '<div class="v-fail"><div><div class="t">Карточка не открылась</div>' +
      '<div class="d">Сервер не ответил. Возможность цела — попробуйте ещё раз.</div></div>' +
      '<button class="v-btn retry" type="button">Повторить</button></div>';
    box.querySelector('.retry').addEventListener('click', () => {
      box.innerHTML = '<div class="v-sk row"></div>'; loadCard(el);
    });
  }
}

async function post(url, body){
  const r = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  });
  if (!r.ok){
    let why = 'Не получилось сохранить.';
    try{ const j = await r.json(); if (j && j.detail) why = j.detail; }catch{}
    throw new Error(why);
  }
  return r.json();
}

function wireCard(el, box){
  const id = el.dataset.id;

  box.querySelector('.save').addEventListener('click', async ev => {
    const btn = ev.currentTarget, was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    const data = {};
    box.querySelectorAll('[name]').forEach(i => { if (!i.disabled) data[i.name] = i.value; });
    const status = data.status, reason = data.lost_reason;
    delete data.status; delete data.lost_reason;
    try{
      await post('/api/leads/' + id, data);
      if (status && status !== box.dataset.status){
        await post('/api/leads/' + id + '/status', {status: status, lost_reason: reason || null});
      }
      toast('Сохранено');
      reload();
    }catch(e){ toast(e.message || 'Не получилось сохранить'); }
    finally{ btn.disabled = false; btn.textContent = was; }
  });

  wireFollowup(el, box, id);

  // «Купил» означает, что заявка существует. Сумму спрашиваем здесь же:
  // возможность оценивал VELOR, а сколько человек заплатил — знает владелец.
  box.querySelector('.won').addEventListener('click', () => {
    const field = box.querySelector('[name="value"]');
    const guess = field ? field.value.replace(/\s/g, '') : '';
    const said = prompt('На какую сумму? Из неё складывается оборот. '
                        + 'Можно оставить пусто.', guess || '');
    if (said === null) return;              // передумал — ничего не меняем
    close(id, 'won', null, said.replace(/\s/g, ''));
  });
  box.querySelector('.lost').addEventListener('click', () => {
    const sel = box.querySelector('[name="lost_reason"]');
    if (sel && !sel.value){
      toast('Выберите причину — без неё проигрыш ничего не объясняет');
      sel.focus();
      return;
    }
    close(id, 'lost', sel ? sel.value : null);
  });
}

// Касание: подготовить, переписать, отправить, отменить. Каждое действие —
// отдельный запрос, и ни одно из них не «наверное отправилось»: сервер
// возвращает состояние, и показываем мы именно его.
function wireFollowup(el, box, id){
  const busy = async (btn, fn) => {
    const was = btn.textContent;
    btn.disabled = true; btn.textContent = '…';
    try{ await fn(); }
    catch(e){ toast(e.message || 'Не получилось'); }
    finally{ btn.disabled = false; btn.textContent = was; }
  };
  const reopen = () => { box.dataset.loaded = '0'; loadCard(el); };
  const at = sel => box.querySelector(sel);
  const fuId = () => { const n = box.querySelector('[data-fu]');
                       return n ? n.dataset.fu : null; };

  const plan = at('.fu-plan');
  if (plan) plan.addEventListener('click', ev => busy(ev.currentTarget, async () => {
    const d = await post('/api/leads/' + id + '/followup', {});
    toast(d.followup ? 'Касание готово' : (d.why || 'Повода писать нет'));
    if (d.followup) reopen();
  }));

  const save = at('.fu-save');
  if (save) save.addEventListener('click', ev => busy(ev.currentTarget, async () => {
    await post('/api/followups/' + fuId() + '/edit', {text: at('.fu-text').value});
    toast('Текст сохранён');
  }));

  const send = at('.fu-send');
  if (send) send.addEventListener('click', ev => busy(ev.currentTarget, async () => {
    const text = at('.fu-text').value;
    await post('/api/followups/' + fuId() + '/edit', {text: text});
    const d = await post('/api/followups/' + fuId() + '/send', {});
    toast(d.ok ? 'Отправлено' : ('Не отправлено: ' + (d.why || 'канал недоступен')));
    reopen();
  }));

  const later = at('.fu-later');
  if (later) later.addEventListener('click', ev => busy(ev.currentTarget, async () => {
    await post('/api/followups/' + fuId() + '/edit', {text: at('.fu-text').value});
    const d = await post('/api/followups/' + fuId() + '/approve', {});
    toast(d.followup && d.followup.status === 'approved'
      ? 'Уйдёт в рабочее время'
      : 'Не получилось: ' + ((d.followup || {}).stop_ru || 'канал недоступен'));
    reopen();
  }));

  const stop = at('.fu-stop');
  if (stop) stop.addEventListener('click', ev => busy(ev.currentTarget, async () => {
    await post('/api/followups/' + fuId() + '/cancel', {});
    toast('Не пишем');
    reopen();
  }));
}

async function close(id, status, reason, amount){
  try{
    const d = await post('/api/leads/' + id + '/status',
                         {status: status, lost_reason: reason,
                          amount: amount || null});
    toast(status === 'won'
      ? (d.order_id ? 'Купил — заявка №' + d.order_id : 'Отмечено: купил')
      : 'Отмечено: не сложилось');
    reload();
  }catch(e){ toast(e.message || 'Не получилось отметить'); }
}

function wireRows(){
  listEl.querySelectorAll('.lead-row').forEach(el => {
    if (el.dataset.wired === '1') return;
    el.dataset.wired = '1';
    const head = el.querySelector('.top');
    const open = () => {
      const on = el.classList.toggle('open');
      head.setAttribute('aria-expanded', on ? 'true' : 'false');
      if (on) loadCard(el);
    };
    head.addEventListener('click', open);
    head.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); open(); }
    });
  });
}

function fail(msg){
  failEl.innerHTML = '<div class="v-fail"><div><div class="t">' + esc(msg) + '</div>' +
    '<div class="d">Данные целы — это не сохранение, а показ. Попробуйте ещё раз.</div></div>' +
    '<button class="v-btn retry" type="button">Повторить</button></div>';
  failEl.querySelector('.retry').addEventListener('click', () => { failEl.innerHTML = ''; reload(); });
}

async function load(more){
  if (loading) return;
  loading = true;
  if (!more){ offset = 0; }
  try{
    const url = '/api/leads?limit=' + PAGE + '&offset=' + offset +
                (segment ? '&status=' + encodeURIComponent(segment) : '');
    const r = await fetch(url);
    if (!r.ok) throw 0;
    const d = await r.json();
    DICT = { statuses: d.statuses || [], reasons: d.reasons || [],
             sources: d.sources || [], levels: d.levels || {} };
    failEl.innerHTML = '';
    paintState(d); paintKpi(d);
    total = d.total || 0;
    const html = (d.items || []).map(leadHTML).join('');
    if (more) listEl.insertAdjacentHTML('beforeend', html);
    else listEl.innerHTML = html || emptyHTML();
    wireRows();
    offset += (d.items || []).length;
    foundEl.textContent = total
      ? 'Показано ' + offset + ' из ' + total
      : '';
    moreEl.style.display = offset < total ? '' : 'none';
  }catch{
    if (!more) listEl.innerHTML = '';
    fail('Возможности не загрузились');
  }finally{ loading = false; }
}

function emptyHTML(){
  if (segment === 'open')
    return '<div class="v-empty"><strong>Открытых возможностей нет</strong>' +
      'Они появятся сами, когда клиент спросит цену, попросит записаться или скажет, что ему нужно. ' +
      'А встреченного вживую можно записать кнопкой «Встретил человека».</div>';
  if (segment === 'won')
    return '<div class="v-empty"><strong>Купивших пока нет</strong>' +
      'Отметьте «Купил» у возможности, которая стала заявкой, — из этого считается конверсия.</div>';
  if (segment === 'lost')
    return '<div class="v-empty"><strong>Потерянных пока нет</strong>' +
      'Когда отметите «Не сложилось» с причиной, здесь будет видно, что мы теряем чаще всего.</div>';
  return '<div class="v-empty"><strong>Возможностей пока нет</strong>' +
    'VELOR заведёт их сам, как только клиент напишет боту или в директ что-то о покупке.</div>';
}

function reload(){ load(false); }

document.getElementById('segs').addEventListener('click', ev => {
  const b = ev.target.closest('.v-seg');
  if (!b) return;
  segment = b.dataset.seg;
  document.querySelectorAll('#segs .v-seg').forEach(x =>
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  reload();
});
moreEl.addEventListener('click', () => load(true));

// ── возможность руками ──
const addBox = document.getElementById('add');
document.getElementById('addBtn').addEventListener('click', async () => {
  const on = addBox.classList.toggle('on');
  if (!on) return;
  document.getElementById('nTitle').focus();
  try{
    const r = await fetch('/api/clients?limit=200');
    if (!r.ok) return;
    const d = await r.json();
    const sel = document.getElementById('nClient');
    sel.innerHTML = '<option value="">— пока не в базе —</option>' +
      (d.items || []).map(c => '<option value="' + c.id + '">' + esc(c.name || 'без имени') + '</option>').join('');
  }catch{}
});
document.getElementById('nCancel').addEventListener('click', () => addBox.classList.remove('on'));
document.getElementById('nSave').addEventListener('click', async ev => {
  const btn = ev.currentTarget, was = btn.textContent;
  const title = document.getElementById('nTitle').value.trim();
  if (!title){ toast('Напишите, чего хочет человек'); document.getElementById('nTitle').focus(); return; }
  const rawValue = document.getElementById('nValue').value.replace(/[^\d]/g, '');
  btn.disabled = true; btn.textContent = 'Записываю…';
  try{
    await post('/api/leads', {
      title: title,
      interest: document.getElementById('nInterest').value.trim() || null,
      client_id: Number(document.getElementById('nClient').value) || null,
      value: rawValue ? Number(rawValue) : null,
      source: 'manual'
    });
    toast('Записал');
    addBox.classList.remove('on');
    document.getElementById('nTitle').value = '';
    document.getElementById('nValue').value = '';
    document.getElementById('nInterest').value = '';
    segment = 'open';
    document.querySelectorAll('#segs .v-seg').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.seg === 'open' ? 'true' : 'false'));
    reload();
  }catch(e){ toast(e.message || 'Не получилось записать'); }
  finally{ btn.disabled = false; btn.textContent = was; }
});

reload();
</script>
</body>
