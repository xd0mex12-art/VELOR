<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELOR AI — Вход</title>
<link href="vendor/inter.css" rel="stylesheet">
<style>
  
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--void); color:var(--bone); font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    font-weight:200; min-height:100dvh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .card{ position:relative; z-index:1; width:min(92vw,400px); text-align:center; padding:20px; }
  .logo{ display:inline-flex; align-items:center; gap:10px; font-weight:400; font-size:var(--fs-h3); letter-spacing:.14em; margin-bottom:40px; }
  h1{ font-weight:400; font-size:var(--fs-display); letter-spacing:-0.03em; margin-bottom:8px; }
  .sub{ color:var(--ash); font-size:var(--fs-body); margin-bottom:36px; }
  input{ width:100%; min-height:50px; background:rgba(255,255,255,.05); border:1px solid var(--hairline);
    border-radius:var(--r-sm); padding:14px 18px; margin-bottom:14px; color:var(--bone); font-family:inherit; font-weight:200; font-size:var(--fs-base);
    transition:border-color .3s, box-shadow .3s; }
  input:focus{ border-color:var(--iris); outline:none; }
  button{ width:100%; min-height:52px; margin-top:8px; border:none; border-radius:var(--r-xl); background:var(--iris); color:#fff;
    font-family:inherit; font-weight:600; font-size:var(--fs-body); letter-spacing:.15em; text-transform:uppercase; cursor:pointer; transition:filter .2s; }
  button:hover{ filter:brightness(1.2)); }
  button:disabled{ opacity:.4; }
  .err{ color:#ff4fd8; font-size:var(--fs-body); min-height:20px; margin-top:14px; }
</style>
<link rel="stylesheet" href="velor.css?v=19">
</head>
<body>
<div class="card">
  <div class="logo"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1 L17 16 L1 16 Z" fill="#8052ff"/></svg>VELOR AI</div>
  <h1>Личный кабинет</h1>
  <p class="sub">Вход для владельца сервиса</p>
  <form id="f" autocomplete="off">
    <input id="login" placeholder="Логин" autocomplete="username">
    <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button type="submit" id="btn">Войти</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
if (localStorage.getItem('coreon_token')) location.replace('admin.html');
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try{
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('pass').value })
    });
    if (r.ok){
      const d = await r.json();
      localStorage.setItem('coreon_token', d.token);
      if (d.refresh_token) localStorage.setItem('coreon_refresh', d.refresh_token);
      location.replace('admin.html');
    } else if (r.status === 429) {
      const d = await r.json().catch(() => ({}));
      err.textContent = d.detail || 'Слишком много попыток. Попробуйте позже.';
    } else {
      err.textContent = 'Неверный логин или пароль';
    }
  }catch{ err.textContent = 'Сервер не отвечает'; }
  btn.disabled = false;
});
</script>
</body>
</html>
