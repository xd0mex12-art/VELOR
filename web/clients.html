<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELOR AI — Клиенты</title>
<link href="vendor/inter.css" rel="stylesheet">
<style>
  /* Клиенты — не «список имён», а ответ на три вопроса владельца:
     кого стало больше, кто покупает и кто перестал возвращаться.
     Раскладка экрана (шапка, цифры, состояния) берётся из velor.css —
     здесь остаётся только то, что есть исключительно на этой вкладке:
     строка клиента и его раскрывающаяся карточка. */
  *{ margin:0; padding:0; box-sizing:border-box; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:rgba(128,82,255,.4); color:#fff; }
  .num{ font-variant-numeric:tabular-nums; }

  /* панель управления списком: срез + поиск в одной строке */
  .tools{ display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap;
    margin:var(--sp-8) 0 var(--sp-5); }
  .search{ position:relative; flex:1 1 300px; max-width:420px; }
  .search input{ width:100%; min-height:48px; background:var(--surface-2);
    border:1px solid var(--hairline); border-radius:var(--r-sm);
    padding:12px 16px 12px 44px; color:var(--bone); font-family:inherit;
    font-weight:var(--fw-thin); font-size:var(--fs-base); }
  .search svg{ position:absolute; left:15px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; stroke:var(--ash); fill:none; pointer-events:none; }
  .found{ font-size:var(--fs-sm); color:var(--ash); min-height:20px; margin-bottom:var(--sp-3); }

  /* строка клиента */
  .client{ border-bottom:1px solid var(--hairline); }
  .row{ display:grid; grid-template-columns:1fr auto; gap:var(--sp-4); align-items:center;
    padding:var(--sp-4) 0; min-height:64px; cursor:pointer;
    transition:background var(--dur), padding-left var(--dur); }
  .row:hover{ background:linear-gradient(90deg,var(--tint-iris),transparent 70%); padding-left:12px; }
  .row .nm{ font-weight:var(--fw-reg); font-size:var(--fs-base); letter-spacing:-.01em; }
  .row .meta{ margin-top:3px; font-weight:var(--fw-thin); font-size:var(--fs-sm); color:var(--ash); }
  .row .rt{ text-align:right; white-space:nowrap; }
  .row .cnt{ font-weight:var(--fw-reg); font-size:var(--fs-body); color:var(--lilac); }
  .row .sum{ font-size:var(--fs-sm); color:var(--verdant); margin-top:2px; }
  /* «уснул» — словом, а не только цветом */
  .row .flag{ display:inline-block; margin-top:4px; font-size:var(--fs-caption);
    color:var(--saffron); }
  .chev{ display:inline-block; width:0; height:0; margin-left:8px; vertical-align:middle;
    border:4px solid transparent; border-top-color:var(--ash);
    transition:transform var(--dur-fast); }
  .client.open .chev{ transform:rotate(-180deg) translateY(2px); }

  /* карточка клиента */
  .card{ display:none; padding:var(--sp-2) 0 var(--sp-6); }
  .client.open .card{ display:block; animation:velorIn .3s var(--ease); }
  .fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:var(--sp-4); margin-bottom:var(--sp-5); }
  .f label{ display:block; font-weight:var(--fw-semi); font-size:var(--fs-caption); letter-spacing:.16em;
    text-transform:uppercase; color:var(--ash); margin-bottom:var(--sp-2); }
  .f input, .f textarea{ width:100%; min-height:48px; background:var(--surface-2);
    border:1px solid var(--hairline); border-radius:var(--r-sm); padding:12px 14px;
    color:var(--bone); font-family:inherit; font-weight:var(--fw-thin); font-size:var(--fs-body); }
  .f textarea{ resize:vertical; min-height:64px; }
  .card-acts{ display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap; }
  .card-acts .sub{ font-size:var(--fs-sm); color:var(--ash); }

  .hist{ margin-top:var(--sp-6); }
  .hist .h, .chat .h{ font-weight:var(--fw-semi); font-size:var(--fs-caption); letter-spacing:.16em;
    text-transform:uppercase; color:var(--ash); margin-bottom:var(--sp-3); }
  .hist .o{ display:flex; gap:var(--sp-4); padding:var(--sp-3) 0;
    border-top:1px solid var(--hairline); font-size:var(--fs-body); font-weight:var(--fw-thin); }
  .hist .o .d{ color:var(--ash); white-space:nowrap; }

  /* резюме AI по клиенту */
  .ai-sum{ margin-top:var(--sp-5); border:1px solid rgba(128,82,255,.28);
    background:var(--tint-iris); border-radius:var(--r-lg); padding:var(--sp-5); }
  .ai-sum .cap{ display:flex; align-items:center; justify-content:space-between;
    gap:var(--sp-3); margin-bottom:var(--sp-3); }
  .ai-sum .cap span{ font-weight:var(--fw-semi); font-size:var(--fs-caption); letter-spacing:.16em;
    text-transform:uppercase; color:var(--lilac); }
  .ai-sum .txt{ font-weight:var(--fw-thin); font-size:var(--fs-body); line-height:1.5; }
  .ai-sum .adv{ margin-top:var(--sp-3); padding-top:var(--sp-3);
    border-top:1px solid rgba(128,82,255,.2); font-weight:var(--fw-thin); font-size:var(--fs-body); }
  .ai-sum .adv b{ display:block; color:var(--verdant); font-weight:var(--fw-semi); font-size:var(--fs-caption);
    letter-spacing:.14em; text-transform:uppercase; margin-bottom:5px; }

  /* переписка */
  .chat{ margin-top:var(--sp-6); }
  .chat .scroll{ max-height:280px; overflow-y:auto; display:flex; flex-direction:column;
    gap:var(--sp-2); padding-right:4px; }
  .msg{ max-width:78%; padding:9px 14px; border-radius:var(--r-md); font-weight:var(--fw-thin);
    font-size:var(--fs-body); line-height:1.45; }
  .msg.user{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--hairline);
    border-bottom-left-radius:5px; }
  .msg.assistant{ align-self:flex-end; background:rgba(128,82,255,.14);
    border:1px solid rgba(128,82,255,.28); border-bottom-right-radius:5px; }
  .msg .who{ display:block; font-size:var(--fs-micro); letter-spacing:.14em; text-transform:uppercase;
    color:var(--ash); margin-bottom:3px; }

  .more{ display:block; margin:var(--sp-8) auto 0; }

  #toast{ position:fixed; bottom:var(--sp-8); left:50%; transform:translate(-50%,20px); z-index:120;
    background:rgba(0,0,0,.78); backdrop-filter:blur(8px); color:var(--bone);
    font-weight:var(--fw-reg); font-size:var(--fs-body); padding:14px 28px;
    border-radius:var(--r-pill); opacity:0; pointer-events:none;
    transition:opacity var(--dur), transform var(--dur); }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  @media(max-width:560px){
    .search{ max-width:none; }
    .v-segs{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px; }
    .v-segs::-webkit-scrollbar{ display:none; }
    .v-seg{ flex:none; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
<link rel="stylesheet" href="velor.css?v=14">
</head>
<body>

<main>
  <!-- 1. заголовок + что здесь сейчас + главное действие -->
  <header class="v-head">
    <div>
      <h1>Клиенты</h1>
      <p class="v-lead">Вся база бизнеса: кто пришёл, кто покупает и кто перестал
        возвращаться. Карточка открывается по клику — там заметки, история заказов
        и переписка.</p>
      <div class="v-state" id="state" aria-live="polite">
        <span class="v-badge calm"><i></i>Считаю базу…</span>
      </div>
    </div>
    <div class="v-acts">
      <a class="v-btn" href="export.html">Выгрузить базу</a>
    </div>
  </header>

  <!-- 2. цифры, ради которых сюда заходят -->
  <div class="v-kpi" id="kpi" aria-live="polite">
    <div class="v-sk"></div><div class="v-sk"></div><div class="v-sk"></div><div class="v-sk"></div>
  </div>

  <!-- 3. срез базы + поиск -->
  <div class="tools">
    <div class="v-segs" id="segs" role="group" aria-label="Срез базы клиентов">
      <button class="v-seg" data-seg="all" aria-pressed="true">Все</button>
      <button class="v-seg" data-seg="new" aria-pressed="false">Новые за 30 дней</button>
      <button class="v-seg" data-seg="buyers" aria-pressed="false">С заказами</button>
      <button class="v-seg" data-seg="sleeping" aria-pressed="false">Не возвращаются</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="q" type="search" aria-label="Поиск по имени или телефону"
        placeholder="Имя или телефон" autocomplete="off">
    </div>
  </div>

  <div id="failZone" role="alert"></div>
  <p class="found" id="found"></p>
  <div id="list"><div class="v-sk row"></div><div class="v-sk row"></div><div class="v-sk row"></div></div>
  <button class="v-btn ghost more" id="more" style="display:none">Показать ещё</button>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script src="panel-auth.js"></script>
<script src="nav.js"></script>
<script src="velor-field.js?v=14"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n) || 0).toLocaleString('ru-RU') + ' ₽';
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  return b === 1 ? one : many;
};
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

const PAGE = 50;
const listEl  = document.getElementById('list');
const moreEl  = document.getElementById('more');
const qEl     = document.getElementById('q');
const foundEl = document.getElementById('found');
const failEl  = document.getElementById('failZone');
let query = '', segment = 'all', offset = 0, total = 0, loading = false;

// ── состояние экрана: одна строка, которая объясняет базу целиком ──
function paintState(d){
  const box = document.getElementById('state');
  if (!d.all_total){
    box.innerHTML = '<span class="v-badge calm"><i></i>База пуста</span>' +
      '<span>клиенты появятся сами, как только напишут боту</span>';
    return;
  }
  const cls = d.active ? 'good' : 'warn';
  const word = d.active ? 'База живая' : 'База молчит';
  const tail = [
    d.active + ' ' + plural(d.active, 'живой за 30 дней', 'живых за 30 дней', 'живых за 30 дней'),
    d.sleeping ? d.sleeping + ' не возвращались ' + d.sleeping_days + '+ дней' : '',
  ].filter(Boolean).join(' · ');
  box.innerHTML = `<span class="v-badge ${cls}"><i></i>${word}</span><span>${esc(tail)}</span>`;
}

// ── четыре цифры: ровно те, по которым принимают решения ──
function paintKpi(d){
  const cards = [
    ['Всего в базе', d.all_total,
     d.new30 ? '+' + d.new30 + ' за 30 дней' : 'новых за месяц не было', 'up'],
    ['Живые · 30 дней', d.active,
     d.all_total ? Math.round(d.active / d.all_total * 100) + '% базы' : '—'],
    ['Средний чек', d.avg_check ? money(d.avg_check) : '—',
     d.avg_check ? 'по заявкам с суммой' : 'проставьте суммы в заявках'],
    ['Заказов всего', d.orders_total,
     d.sleeping ? d.sleeping + ' клиентов уснули' : 'уснувших нет'],
  ];
  document.getElementById('kpi').innerHTML = cards.map(([k, v, s, cls]) => `
    <div class="v-kpi-card">
      <div class="k">${k}</div>
      <div class="v num">${typeof v === 'number' ? v.toLocaleString('ru-RU') : esc(v)}</div>
      <div class="s ${cls === 'up' && d.new30 ? 'up' : ''}">${esc(s)}</div>
    </div>`).join('');
}

function isSleeping(c){
  if (!c.last_order_at) return false;
  const d = new Date(String(c.last_order_at).replace(' ', 'T') + 'Z');
  return !isNaN(d) && (Date.now() - d) > 60 * 86400000;
}

function rowMeta(c){
  return [c.phone && 'тел. ' + esc(c.phone), c.birthday && 'др ' + esc(c.birthday),
          c.favorite && 'любит ' + esc(c.favorite)].filter(Boolean).join(' · ')
    || 'нет данных — откройте и заполните';
}

function clientHTML(c){
  return `
    <div class="client" data-id="${c.id}">
      <div class="row" role="button" tabindex="0" aria-expanded="false">
        <div>
          <div class="nm">${esc(c.name) || 'Без имени'}<span class="chev" aria-hidden="true"></span></div>
          <div class="meta">${rowMeta(c)}</div>
        </div>
        <div class="rt">
          <div class="cnt num">${c.orders_count || 0} ${plural(c.orders_count || 0, 'заказ', 'заказа', 'заказов')}</div>
          ${c.total_spent ? `<div class="sum num">${money(c.total_spent)}</div>` : ''}
          ${isSleeping(c) ? '<div class="flag">не возвращается</div>' : ''}
        </div>
      </div>
      <div class="card" data-loaded="0"><div class="v-sk row"></div></div>
    </div>`;
}

function cardHTML(d){
  const c = d.client;
  const orders = d.orders || [], messages = d.messages || [];
  const ordersHTML = orders.length
    ? orders.map(o => `<div class="o"><span class="d num">№${o.id} · ${esc((o.created_at||'').slice(0,10))}</span>
        <span>${esc(o.text)}${o.amount ? ' — <span class="num">'+money(o.amount)+'</span>' : ''}</span>
        <span class="d">${esc(o.status)}</span></div>`).join('')
    : '<div class="v-empty">Заказов пока нет. Появятся, когда клиент что-то закажет через бота или вы добавите заявку вручную.</div>';
  const chatHTML = messages.length
    ? `<div class="chat"><div class="h">История переписки</div><div class="scroll">${
        messages.map(m => `<div class="msg ${m.role === 'user' ? 'user' : 'assistant'}">
          <span class="who">${m.role === 'user' ? 'клиент' : 'сотрудник'}</span>${esc(m.content)}</div>`).join('')
      }</div></div>`
    : '';
  // Возможности этого человека. Один человек — несколько возможностей: майский
  // букет и августовская свадьба стоят здесь рядом как две разные истории.
  const leads = d.leads || [];
  const leadsHTML = leads.length
    ? `<div class="hist"><div class="h">Возможности</div><div class="orders">${
        leads.map(l => `<div class="o"><span class="d num">${esc((l.created_at||'').slice(0,10))}</span>
          <span>${esc(l.title)}${l.value ? ' — <span class="num">'+money(l.value)+'</span>' : ''}</span>
          <span class="d">${esc(l.status_ru)}${l.lost_reason_ru ? ' · ' + esc(l.lost_reason_ru) : ''}</span></div>`).join('')
      }</div><div class="v-empty" style="padding-top:8px">Открыть и изменить — на странице
      <a href="leads.html">«Возможности»</a>.</div></div>`
    : '';
  const aiHTML = `
    <div class="ai-sum">
      <div class="cap"><span>Резюме AI</span>
        <button class="v-btn ghost sm refresh" type="button">Обновить</button></div>
      <div class="txt">${d.summary ? esc(d.summary)
        : 'Резюме появится, когда наберётся история переписки или заказов — либо нажмите «Обновить».'}</div>
      ${d.advice ? `<div class="adv"><b>Что предложить</b>${esc(d.advice)}</div>` : ''}
    </div>`;
  return `
    <div class="fields">
      <div class="f"><label>Имя</label><input name="name" value="${esc(c.name)}"></div>
      <div class="f"><label>Телефон</label><input name="phone" type="tel" inputmode="tel" value="${esc(c.phone)}"></div>
      <div class="f"><label>День рождения</label><input name="birthday" placeholder="например 14 марта" value="${esc(c.birthday)}"></div>
      <div class="f"><label>Предпочтения</label><input name="favorite" placeholder="что важно для клиента" value="${esc(c.favorite)}"></div>
      <div class="f" style="grid-column:1/-1"><label>Заметки</label><textarea name="notes" rows="2">${esc(c.notes)}</textarea></div>
    </div>
    <div class="card-acts">
      <button class="v-btn save">Сохранить</button>
      <span class="sub">Куплено на <span class="num" style="color:var(--verdant)">${money(c.total_spent)}</span>
        · ${c.orders_count || 0} ${plural(c.orders_count || 0, 'заказ', 'заказа', 'заказов')}</span>
    </div>
    ${aiHTML}
    ${leadsHTML}
    <div class="hist"><div class="h">История заказов</div><div class="orders">${ordersHTML}</div></div>
    ${chatHTML}`;
}

async function loadCard(el){
  const box = el.querySelector('.card');
  if (box.dataset.loaded === '1') return;
  const id = el.dataset.id;
  try{
    const r = await fetch(`/api/clients/${id}`);
    if (!r.ok) throw 0;
    box.innerHTML = cardHTML(await r.json());
    box.dataset.loaded = '1';
    wireCard(el, box);
  }catch{
    box.innerHTML = `<div class="v-fail"><div><div class="t">Карточка не открылась</div>
      <div class="d">Сервер не ответил. Данные клиента целы — попробуйте ещё раз.</div></div>
      <button class="v-btn retry" type="button">Повторить</button></div>`;
    box.querySelector('.retry').addEventListener('click', () => {
      box.innerHTML = '<div class="v-sk row"></div>'; loadCard(el);
    });
  }
}

function wireCard(el, box){
  const id = el.dataset.id;
  box.querySelector('.save').addEventListener('click', async ev => {
    const btn = ev.currentTarget, was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    const data = {};
    box.querySelectorAll('input,textarea').forEach(i => data[i.name] = i.value);
    try{
      const r = await fetch(`/api/clients/${id}`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
      });
      if (!r.ok) throw 0;
      toast('Сохранено');
      el.querySelector('.meta').textContent = [data.phone && 'тел. ' + data.phone,
        data.birthday && 'др ' + data.birthday, data.favorite && 'любит ' + data.favorite]
        .filter(Boolean).join(' · ') || 'нет данных';
      el.querySelector('.nm').innerHTML = esc(data.name || 'Без имени') + '<span class="chev" aria-hidden="true"></span>';
    }catch{ toast('Не сохранилось — проверьте связь с сервером'); }
    btn.disabled = false; btn.textContent = was;
  });
  box.querySelector('.refresh').addEventListener('click', async ev => {
    const btn = ev.currentTarget; btn.disabled = true;
    const txt = box.querySelector('.ai-sum .txt');
    const prev = txt.textContent; txt.textContent = 'Собираю резюме…';
    try{
      const r = await fetch(`/api/clients/${id}/summary/refresh`, {method:'POST'});
      if (!r.ok) throw 0;
      const d = await r.json();
      txt.textContent = d.summary || 'Пока мало данных для резюме.';
      let adv = box.querySelector('.ai-sum .adv');
      if (d.advice){
        if (!adv){ adv = document.createElement('div'); adv.className = 'adv';
          box.querySelector('.ai-sum').appendChild(adv); }
        adv.innerHTML = '<b>Что предложить</b>' + esc(d.advice);
      } else if (adv){ adv.remove(); }
    }catch{ txt.textContent = prev; toast('Резюме не обновилось — ИИ сейчас недоступен'); }
    btn.disabled = false;
  });
}

function wireRow(el){
  const row = el.querySelector('.row');
  const toggle = () => {
    el.classList.toggle('open');
    row.setAttribute('aria-expanded', el.classList.contains('open'));
    if (el.classList.contains('open')) loadCard(el);
  };
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
  });
}

const EMPTY = {
  all:      ['Пока никого', 'Клиенты появляются сами, как только пишут вашему боту. <a href="guide.html">Подключить бота →</a>'],
  new:      ['За 30 дней новых не было', 'Все, кто есть в базе, пришли раньше. <a href="growth.html">Посмотреть, как привлечь →</a>'],
  buyers:   ['Заказов ещё не было', 'Здесь окажутся все, у кого есть хотя бы одна заявка. <a href="orders.html">Открыть заявки →</a>'],
  sleeping: ['Все на месте', 'Никто не пропадал дольше 60 дней — это хороший знак.'],
};

function paintFail(){
  failEl.innerHTML = `<div class="v-fail"><div><div class="t">Не удалось загрузить клиентов</div>
    <div class="d">Сервер не ответил. Проверьте, что он запущен, и повторите.</div></div>
    <button class="v-btn" type="button" id="retry">Повторить</button></div>`;
  document.getElementById('retry').addEventListener('click', () => {
    failEl.innerHTML = ''; loadPage(true);
  });
}

async function loadPage(reset){
  if (loading) return;
  loading = true;
  if (reset){
    offset = 0;
    listEl.innerHTML = '<div class="v-sk row"></div><div class="v-sk row"></div><div class="v-sk row"></div>';
  }
  moreEl.disabled = true;
  try{
    const url = `/api/clients?limit=${PAGE}&offset=${offset}&segment=${segment}`
      + (query ? `&q=${encodeURIComponent(query)}` : '');
    const r = await fetch(url);
    if (!r.ok) throw 0;
    const d = await r.json();
    failEl.innerHTML = '';
    total = d.total || 0;
    const items = d.items || [];

    paintState(d);
    paintKpi(d);

    if (reset) listEl.innerHTML = '';
    if (!total){
      const [head, body] = query
        ? ['Никого не нашли', 'По запросу «' + esc(query) + '» совпадений нет. Попробуйте часть имени или последние цифры телефона.']
        : EMPTY[segment];
      listEl.innerHTML = `<div class="v-empty"><strong>${head}</strong>${body}</div>`;
      foundEl.textContent = '';
      moreEl.style.display = 'none';
      return;
    }
    foundEl.textContent = query
      ? `Найдено: ${total} ${plural(total, 'клиент', 'клиента', 'клиентов')}`
      : `${total} ${plural(total, 'клиент', 'клиента', 'клиентов')} в этом срезе`;
    items.forEach(c => {
      listEl.insertAdjacentHTML('beforeend', clientHTML(c));
      wireRow(listEl.lastElementChild);
    });
    offset += items.length;
    moreEl.style.display = offset < total ? 'block' : 'none';
  }catch{
    if (reset){ listEl.innerHTML = ''; foundEl.textContent = ''; paintFail(); }
    else toast('Не удалось загрузить ещё — попробуйте снова');
  }finally{
    loading = false; moreEl.disabled = false;
  }
}

document.getElementById('segs').addEventListener('click', e => {
  const b = e.target.closest('.v-seg'); if (!b || b.dataset.seg === segment) return;
  segment = b.dataset.seg;
  document.querySelectorAll('.v-seg').forEach(s => s.setAttribute('aria-pressed', String(s === b)));
  loadPage(true);
});

let searchT;
qEl.addEventListener('input', () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { query = qEl.value.trim(); loadPage(true); }, 250);
});
moreEl.addEventListener('click', () => loadPage(false));
loadPage(true);
</script>
</body>
</html>
