<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELOR AI — Риски</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:rgba(128,82,255,.4); color:#fff; }

  .scan{ min-height:48px; padding:13px 30px; border-radius:26px; background:rgba(255,107,107,.14);
    border:1px solid rgba(255,107,107,.4); color:#fff; font-weight:600; font-size:13.5px;
    letter-spacing:.1em; text-transform:uppercase; transition:background .2s; margin-bottom:14px; }
  .scan:hover{ background:rgba(255,107,107,.26); }
  .scan:disabled{ opacity:.5; }
  .hint{ font-size:13.5px; color:var(--ash); margin-bottom:36px; }

  /* тренды: последние 30 дней против предыдущих */
  .trends{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hairline);
    border:1px solid var(--hairline); border-radius:20px; overflow:hidden; margin-bottom:34px; }
  .tr{ background:#050506; padding:18px 20px; }
  .tr .k{ font-weight:600; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ash); }
  .tr .v{ font-weight:400; font-size:23px; letter-spacing:-.02em; margin-top:6px; font-variant-numeric:tabular-nums; }
  .tr .d{ font-size:12.5px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .tr .d.up{ color:var(--verdant); } .tr .d.down{ color:var(--coral); } .tr .d.flat{ color:var(--ash); }
  .tr .d.badup{ color:var(--coral); }
  @media(max-width:640px){ .trends{ grid-template-columns:repeat(2,1fr); } }

  .cards{ display:grid; gap:16px; }
  .risk{ position:relative; border:1px solid var(--hairline); border-radius:22px; padding:24px 26px;
    background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
    opacity:0; transform:translateY(12px); animation:rIn .5s cubic-bezier(.22,1,.36,1) forwards;
    transition:border-color .25s; }
  .risk:hover{ border-color:rgba(255,107,107,.32); }
  @keyframes rIn{ to{ opacity:1; transform:none } }
  .risk::before{ content:''; position:absolute; left:0; top:22px; bottom:22px; width:3px;
    border-radius:0 3px 3px 0; }
  .risk.l1::before{ background:var(--coral); }
  .risk.l2::before{ background:var(--saffron); }
  .risk.l3::before{ background:#7a7a7a; }
  .risk.l1{ background:linear-gradient(165deg,rgba(255,107,107,.07),rgba(255,255,255,.012)); }

  .r-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .lv{ display:flex; align-items:center; gap:6px; font-weight:600; font-size:9.5px;
    letter-spacing:.16em; text-transform:uppercase; padding:5px 11px; border-radius:16px; }
  .l1 .lv{ background:rgba(255,107,107,.16); color:#ff9b9b; }
  .l2 .lv{ background:rgba(255,184,41,.14); color:#ffd48a; }
  .l3 .lv{ background:rgba(255,255,255,.06); color:var(--ash); }
  .cat{ font-size:12px; color:var(--ash); }
  .r-title{ font-weight:400; font-size:20px; letter-spacing:-.02em; line-height:1.3; margin-bottom:12px; }
  .r-why{ color:var(--silver); font-weight:200; font-size:15px; line-height:1.6; }
  .r-act{ margin-top:14px; padding:14px 16px; border-radius:14px; background:rgba(47,212,178,.07);
    border:1px solid rgba(47,212,178,.2); }
  .r-act .t{ font-weight:600; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--verdant); margin-bottom:5px; }
  .r-act .p{ font-weight:200; font-size:15px; line-height:1.55; }
  .r-btns{ display:flex; gap:9px; margin-top:16px; }
  .rb{ padding:9px 17px; border-radius:20px; background:rgba(255,255,255,.05);
    border:1px solid var(--hairline); color:var(--silver); font-size:13px; transition:.2s; }
  .rb:hover{ color:#fff; border-color:rgba(255,255,255,.22); }

  .empty{ color:var(--ash); font-size:15px; padding:28px 0; line-height:1.6; }
  .calm{ display:flex; gap:13px; align-items:flex-start; padding:22px 24px; border-radius:20px;
    background:rgba(47,212,178,.06); border:1px solid rgba(47,212,178,.22); }
  .calm .ic{ width:26px; height:26px; border-radius:9px; flex:none; background:var(--verdant);
    display:flex; align-items:center; justify-content:center; color:#04241d; font-weight:700; font-size:14px; }
  .calm .p{ font-weight:200; font-size:15.5px; line-height:1.6; color:var(--silver); }

  @media(min-width:900px){ .cards{ grid-template-columns:1fr 1fr; } }
</style>
<link rel="stylesheet" href="velor.css">
</head>
<body>

<main>
  <span class="label">// Risks · Что может пойти не так</span>
  <h1>Риски.</h1>
  <p class="lead">VELOR сравнивает последние 30 дней с предыдущими и предупреждает, если расходы растут, прибыль падает, клиенты уходят или бизнес держится на одном источнике.</p>

  <button class="scan" id="scan">Проверить риски</button>
  <div class="hint" id="hint">Проверка занимает несколько секунд.</div>

  <div class="trends" id="trends"></div>
  <div class="cards" id="cards"><div class="empty">Загружаю…</div></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script src="panel-auth.js"></script>
<script src="nav.js"></script>
<script>
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 3200);
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const LV = { 1:'угроза сейчас', 2:'тревожный сигнал', 3:'держать в виду' };
const money = n => (n || 0).toLocaleString('ru-RU') + ' ₽';

// для расхода рост — это плохо, поэтому цвет считаем отдельно
function delta(pct, goodWhenUp){
  if (pct === null || pct === undefined) return '<span class="d flat">не с чем сравнить</span>';
  if (pct === 0) return '<span class="d flat">без изменений</span>';
  const good = goodWhenUp ? pct > 0 : pct < 0;
  return `<span class="d ${good ? 'up' : 'down'}">${pct > 0 ? '+' : ''}${pct}% к прошлым 30 дням</span>`;
}

function trends(s){
  if (!s) return '';
  const c = s.current, ch = s.change;
  const cell = (k, val, pct, goodWhenUp) =>
    `<div class="tr"><div class="k">${k}</div><div class="v">${val}</div>${delta(pct, goodWhenUp)}</div>`;
  return [
    cell('Доход · 30 дней', money(c.income), ch.income, true),
    cell('Расход · 30 дней', money(c.expense), ch.expense, false),
    cell('Прибыль · 30 дней', money(c.profit), ch.profit, true),
    cell('Новые клиенты', c.clients, ch.clients, true),
    cell('Заявки', c.orders, ch.orders, true),
    cell('Обращения', c.messages, ch.messages, true),
  ].join('');
}

function card(r, i){
  return `<article class="risk l${r.level}" style="animation-delay:${Math.min(i,8)*70}ms" data-id="${r.id}">
    <div class="r-head">
      <span class="lv">${LV[r.level] || 'сигнал'}</span>
      <span class="cat">${esc(r.category || '')}</span>
    </div>
    <div class="r-title">${esc(r.title)}</div>
    ${r.why ? `<div class="r-why">${esc(r.why)}</div>` : ''}
    ${r.action ? `<div class="r-act"><div class="t">Что сделать</div><div class="p">${esc(r.action)}</div></div>` : ''}
    <div class="r-btns"><button class="rb" data-st="hidden">Не актуально</button></div>
  </article>`;
}

async function load(){
  const box = document.getElementById('cards');
  try{
    const d = await (await fetch('/api/risks')).json();
    document.getElementById('trends').innerHTML = trends(d.signals);
    box.innerHTML = d.items && d.items.length
      ? d.items.map(card).join('')
      : `<div class="calm"><span class="ic">✓</span><div class="p">Проверка ещё не запускалась.
         Нажмите «Проверить риски» — VELOR сравнит два периода и скажет, что настораживает.</div></div>`;
  }catch{ box.innerHTML = '<div class="empty">Не удалось загрузить.</div>'; }
}

document.getElementById('scan').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true; b.textContent = 'Проверяю…';
  document.getElementById('hint').textContent = 'VELOR сравнивает два периода: деньги, клиентов, заявки…';
  try{
    const d = await (await fetch('/api/risks/scan', { method:'POST' })).json();
    if (d.ok){ await load(); toast('Проверка закончена: ' + d.items.length); }
    else toast(d.error || 'Не получилось');
  }catch{ toast('Ошибка связи с сервером'); }
  b.disabled = false; b.textContent = 'Проверить риски';
  document.getElementById('hint').textContent = 'Проверка занимает несколько секунд.';
});

document.getElementById('cards').addEventListener('click', async e => {
  const btn = e.target.closest('.rb'); if (!btn) return;
  const id = btn.closest('.risk').dataset.id;
  try{
    await fetch('/api/risks/' + id + '/status', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status:'hidden' }) });
    await load(); toast('Убрал из списка');
  }catch{ toast('Не удалось сохранить'); }
});

load();
</script>
</body>
</html>
