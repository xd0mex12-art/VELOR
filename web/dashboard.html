<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELOR AI — Обзор бизнеса</title>
<link href="vendor/inter.css" rel="stylesheet">
<script src="vendor/three.min.js"></script>
<style>
  /* Главная = утренний брифинг владельца: за 30 секунд видно состояние дел
     и что делать. Порядок блоков — это порядок вопросов в голове:
     «как я?» → «сколько денег?» → «что думает VELOR?» → «за что взяться?»
     → «что изменилось без меня?». Всё остальное живёт в своих разделах. */
  *{ margin:0; padding:0; box-sizing:border-box; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:rgba(128,82,255,.4); color:#fff; }
  :focus-visible{ outline:2px solid var(--iris); outline-offset:3px; border-radius:var(--r-xs); }
  .num{ font-variant-numeric:tabular-nums; }
  #ambientCanvas{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  body main{ padding-top:104px; padding-bottom:80px; }
  section + section{ margin-top:var(--sp-6); }

  /* ── шапка брифинга ── */
  .head{ display:grid; grid-template-columns:1fr auto; align-items:start;
    gap:var(--sp-4) var(--sp-6); margin-bottom:var(--sp-6); }
  .head .pulse{ justify-content:flex-end; margin-bottom:var(--sp-3); }
  @media(max-width:760px){
    .head{ grid-template-columns:1fr; }
    .head .pulse{ justify-content:flex-start; }
    .head .v-acts > *{ flex:1 1 auto; justify-content:center; }
  }
  .head .date{ font-weight:400; font-size:var(--fs-sm); letter-spacing:.04em;
    text-transform:lowercase; color:var(--ash); margin-bottom:var(--sp-2); }
  .hi{ font-weight:400; font-size:clamp(26px,3.2vw,40px); letter-spacing:-.035em; line-height:1.1; }
  .hi b{ font-weight:500; color:var(--lilac-2); }
  /* Строка статуса — общий компонент .v-state; своим остаётся только хвост фактов. */
  .v-state .tail{ color:var(--ash); font-size:var(--fs-body); }
  .pulse{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-sm); color:var(--ash); }
  .pulse .dot{ width:7px; height:7px; border-radius:50%; background:var(--verdant);
    box-shadow:0 0 9px rgba(47,212,178,.8); animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.55; transform:scale(.82) } 50%{ opacity:1; transform:scale(1.1) } }


  /* ── «Что говорит VELOR» — интеллектуальное ядро экрана ── */
  .says{ border:1px solid rgba(128,82,255,.28); border-radius:var(--r-xl);
    background:linear-gradient(150deg,rgba(128,82,255,.13),rgba(91,108,255,.04) 55%,rgba(255,255,255,.015));
    padding:var(--sp-6); }
  .says-head{ display:flex; align-items:center; gap:var(--sp-4); margin-bottom:var(--sp-5); }
  .core-square{ position:relative; width:76px; height:76px; flex:none; }
  #coreCanvas{ position:absolute; inset:0; width:100%!important; height:100%!important; }
  .says-head h2{ font-weight:500; font-size:var(--fs-h3); letter-spacing:-.02em; }
  .says-head .sub{ color:var(--ash); font-size:var(--fs-sm); font-weight:200; margin-top:3px; }

  .slots{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-3); }
  .slot{ border:1px solid var(--hairline); border-radius:var(--r-lg); padding:var(--sp-5);
    background:rgba(0,0,0,.28); display:flex; flex-direction:column; min-height:126px;
    transition:border-color .25s, background .25s; }
  a.slot:hover{ border-color:rgba(128,82,255,.4); background:rgba(0,0,0,.16); }
  .slot .tag{ display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    font-weight:600; font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
    padding:4px 10px; border-radius:var(--r-md); margin-bottom:var(--sp-3); }
  .tag.obs{ background:rgba(255,255,255,.07); color:var(--silver); }
  .tag.prob{ background:rgba(255,107,107,.16); color:var(--ink-coral); }
  .tag.rec{ background:rgba(128,82,255,.18); color:var(--ink-iris); }
  .tag.opp{ background:rgba(47,212,178,.14); color:var(--ink-verdant); }
  .slot .line{ font-weight:400; font-size:var(--fs-lead); letter-spacing:-.02em; line-height:1.3; }
  .slot .why{ color:var(--ash); font-weight:200; font-size:var(--fs-body); line-height:1.5;
    margin-top:var(--sp-2);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .slot.void{ background:transparent; border-style:dashed; border-color:rgba(255,255,255,.10); }
  /* скелет слота повторяет его высоту точь-в-точь — иначе контент прыгнет */
  .slots .v-sk{ min-height:126px; }
  .slot.void .line{ font-size:var(--fs-body); color:var(--ash); font-weight:200; }

  /* Источник расчёта — не мелкий шрифт ради красоты, а часть цифры: без него
     число нечем проверить. Поэтому он стоит в самой карточке, а не в подсказке. */
  .v-kpi-card .src{ margin-top:var(--sp-2); font-size:var(--fs-caption); color:var(--ash);
    line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; }
  .v-kpi-card .v.void{ font-size:var(--fs-body); color:var(--ash); font-weight:200;
    letter-spacing:0; }

  /* находка Директора внутри раздела */
  .fnd + .fnd{ margin-top:var(--sp-4); padding-top:var(--sp-4);
    border-top:1px solid var(--hairline); }
  .fnd .t{ font-weight:400; font-size:var(--fs-lead); letter-spacing:-.02em; line-height:1.3; }
  .fnd .t .lv{ display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:8px; vertical-align:middle; background:var(--ash); }
  .fnd .t .lv.urgent{ background:var(--coral); }
  .fnd .t .lv.warn{ background:var(--saffron); }
  .fnd .t .lv.good{ background:var(--verdant); }
  .fnd .why{ color:var(--silver); font-weight:200; font-size:var(--fs-body);
    line-height:1.5; margin-top:var(--sp-2); }
  .fnd .src{ color:var(--ash); font-size:var(--fs-caption); line-height:1.45;
    margin-top:var(--sp-2); }
  .slot{ min-height:126px; }
  .basis{ margin-top:var(--sp-4); font-size:var(--fs-caption); color:var(--ash); line-height:1.5; }
  .basis b{ font-weight:400; color:var(--silver); }
  .gaps{ margin-top:var(--sp-3); display:grid; gap:6px; }
  .gaps .g{ font-size:var(--fs-caption); color:var(--ash); line-height:1.45;
    padding-left:14px; position:relative; }
  .gaps .g::before{ content:""; position:absolute; left:0; top:7px; width:5px; height:5px;
    border-radius:50%; background:var(--hairline-2); }

  /* ── два списка внизу: дела и события ── */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); }
  .more{ display:inline-flex; align-items:center; min-height:44px; margin-top:var(--sp-2);
    color:var(--lilac); font-size:var(--fs-sm); }
  /* пустое состояние внутри панели живёт плотнее, чем на весь экран */
  .v-panel .v-empty{ padding:var(--sp-2) 0; }

  footer{ position:relative; z-index:1; display:flex; justify-content:space-between; gap:var(--sp-5);
    flex-wrap:wrap; max-width:1280px; margin:0 auto; padding:56px var(--sp-6) var(--sp-6); }
  .caption{ font-weight:200; font-size:var(--fs-caption); color:var(--ash); }

  #toast{ position:fixed; bottom:32px; left:50%; transform:translate(-50%,20px); z-index:120;
    background:rgba(0,0,0,.78); backdrop-filter:blur(8px); color:var(--bone); font-weight:400;
    font-size:var(--fs-body); padding:14px 28px; border-radius:var(--r-xl); opacity:0;
    pointer-events:none; transition:opacity .3s, transform .3s; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  @media(max-width:1000px){
    .cols{ grid-template-columns:1fr; }
  }
  @media(max-width:720px){
    .says{ padding:var(--sp-5); }
    .slots{ grid-template-columns:1fr; }
    .core-square{ width:60px; height:60px; }
  }
  @media(max-width:560px){
    body main{ padding-top:92px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
<link rel="stylesheet" href="velor.css">
</head>
<body>

<canvas id="ambientCanvas"></canvas>

<main>
  <!-- 1. Кто я, какой сегодня день, как дела -->
  <header class="head">
    <div>
      <p class="date" id="today">&nbsp;</p>
      <h1 class="hi" id="greeting">Обзор бизнеса, <b id="hiName">компания</b>.</h1>
      <p class="v-state" id="status"><span class="tail">Смотрю, что у вас происходит…</span></p>
    </div>
    <div>
      <div class="pulse"><span class="dot"></span><span id="pulse">сотрудник на связи</span></div>
      <div class="v-acts">
        <a class="v-btn" href="home.html">Спросить VELOR</a>
        <a class="v-btn ghost" href="timeline.html">Вся история</a>
      </div>
    </div>
  </header>

  <div id="trialZone"></div>
  <div id="failZone" role="alert"></div>

  <!-- 2. Исполнительная сводка: шесть чисел о состоянии дел -->
  <section class="v-kpi" id="kpi" aria-label="Исполнительная сводка" aria-live="polite">
    <div class="v-sk"></div><div class="v-sk"></div><div class="v-sk"></div>
    <div class="v-sk"></div><div class="v-sk"></div><div class="v-sk"></div>
  </section>

  <!-- 3. Что об этом думает VELOR -->
  <section class="says v-in" aria-labelledby="saysTitle">
    <div class="says-head">
      <div class="core-square"><canvas id="coreCanvas"></canvas></div>
      <div>
        <h2 id="saysTitle">Что происходит с бизнесом</h2>
        <p class="sub" id="saysSub">Смотрю на ваши цифры…</p>
      </div>
    </div>
    <div class="slots" id="slots" aria-live="polite">
      <div class="v-sk"></div><div class="v-sk"></div>
      <div class="v-sk"></div><div class="v-sk"></div>
    </div>
    <p class="basis" id="basis"></p>
    <div class="gaps" id="gaps"></div>
  </section>

  <!-- 4. За что взяться и что изменилось -->
  <section class="cols">
    <div class="v-panel" id="attnPanel"><div class="v-sk panel"></div></div>
    <div class="v-panel" id="actsPanel"><div class="v-sk panel"></div></div>
  </section>
</main>

<footer>
  <span class="caption">VELOR AI · Оператор для малого бизнеса · 2026</span>
  <span class="caption">Обновляется автоматически каждые 30 секунд</span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="panel-auth.js"></script>
<script src="nav.js"></script>
<script src="core-live.js?v=10"></script>
<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const money = n => (n || 0).toLocaleString('ru-RU') + ' ₽';
const num   = n => (n || 0).toLocaleString('ru-RU');

function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return one;
  if (n10 >= 2 && n10 <= 4 && !(n100 >= 12 && n100 <= 14)) return few;
  return many;
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 3000);
}

// Изменение показателя. Без сравнения не выдумываем «0%» и не повторяем
// подпись карточки: строка под цифрой должна что-то добавлять, а не дублировать.
function chg(pct, value, goodWhenUp = true){
  if (pct === null || pct === undefined){
    return value
      ? '<span class="s">первый месяц — сравнить пока не с чем</span>'
      : '<span class="s">движения по деньгам ещё не было</span>';
  }
  if (pct === 0) return '<span class="s">столько же, сколько месяц назад</span>';
  const good = goodWhenUp ? pct > 0 : pct < 0;
  return `<span class="s ${good ? 'up' : 'down'}">${pct > 0 ? '+' : ''}${pct}% к прошлому месяцу</span>`;
}

function ago(iso){
  const d = new Date((iso || '').replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return m + ' мин назад';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' ч назад';
  return Math.round(h / 24) + ' дн назад';
}

// ── шапка: дата и приветствие по времени суток ──
const _bizName = localStorage.getItem('coreon_biz_name') || 'компания';
(function(){
  const now = new Date(), h = now.getHours();
  const g = (h < 5 || h >= 23) ? 'Доброй ночи' : h < 12 ? 'Доброе утро'
          : h < 18 ? 'Добрый день' : 'Добрый вечер';
  document.getElementById('greeting').innerHTML = esc(g) + ', <b id="hiName"></b>.';
  document.getElementById('hiName').textContent = _bizName;
  document.getElementById('today').textContent =
    now.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
})();

// ── статус бизнеса: одна оценка + один факт. Цвет всегда продублирован словом ──
// Пороги те же, что в business_health на сервере: новый бизнес — спокойное
// «На старте», а не тревожный красный.
function statusLine(d){
  const score = d.health || 0;
  const head = d.director && d.director.headline ? d.director.headline : '';
  let color, lvl;
  if      (score >= 75){ color = 'var(--verdant)'; lvl = 'Здоровый'; }
  else if (score >= 50){ color = 'var(--verdant)'; lvl = 'Стабильный'; }
  else if (score >= 25){ color = 'var(--saffron)'; lvl = 'Требует внимания'; }
  else                 { color = 'var(--lilac)';   lvl = 'На старте'; }

  const o = d.orders || {}, cl = d.clients || {};
  const bits = [];
  if (o.new)     bits.push(num(o.new) + ' ' + plural(o.new, 'новая заявка', 'новые заявки', 'новых заявок'));
  if (o.total)   bits.push('всего ' + num(o.total));
  if (cl.active) bits.push(num(cl.active) + ' ' + plural(cl.active, 'активный клиент', 'активных клиента', 'активных клиентов'));
  const tail = bits.length ? bits.join(' · ') : 'данных пока мало — я коплю их с каждым днём';

  // Первым делом — прямой ответ на вопрос страницы. Оценка состояния и факты
  // идут после него: сначала «что происходит», потом «насколько это хорошо».
  return `<span class="v-badge" style="color:${color}"><i></i>${esc(lvl)}</span>
          <span class="tail">${esc(head || tail)}</span>`;
}

// ── Исполнительная сводка ──
// Шесть чисел, отвечающих на «как идут дела», и под каждым — из чего оно
// посчитано. Цифра без источника проверке не поддаётся, а значит, и решение
// по ней принимать нельзя.
function deltaHTML(m){
  if (m.delta === null || m.delta === undefined){
    // «Сравнить не с чем» — только там, где сравнение вообще имело смысл.
    // У маржи его нет никогда: это доля, а не движение.
    const why = m.gap || m.hint;
    return `<span class="s">${esc(why || 'сравнить пока не с чем')}</span>`;
  }
  if (m.delta === 0) return '<span class="s">без изменений к прошлому периоду</span>';
  const good = m.good_up ? m.delta > 0 : m.delta < 0;
  return `<span class="s ${good ? 'up' : 'down'}">${m.delta > 0 ? '+' : ''}${m.delta}% к прошлому периоду</span>`;
}

function briefHTML(dir){
  return dir.metrics.map(m => {
    const body = `<span class="k">${esc(m.label)}</span>
       <span class="v num${m.enough ? '' : ' void'}">${esc(m.display)}</span>
       ${deltaHTML(m)}
       <span class="src">${esc(m.source)}</span>`;
    return m.href ? `<a class="v-kpi-card" href="${esc(m.href)}">${body}</a>`
                  : `<div class="v-kpi-card">${body}</div>`;
  }).join('');
}

// ── Разбор: что изменилось, риски, возможности, рекомендации ──
const DIR_SECTIONS = [
  ['changed',         'obs',  'Что изменилось', 'Заметных изменений к прошлому периоду нет.'],
  ['risks',           'prob', 'Риски',          'Рисков по этим данным не вижу.'],
  ['opportunities',   'opp',  'Возможности',    'Возможности появятся, когда наберётся история.'],
  ['recommendations', 'rec',  'Рекомендации',   'Отдельной рекомендации нет — всё идёт своим ходом.'],
];

function findingHTML(f){
  return `<div class="fnd">
    <div class="t"><span class="lv ${esc(f.level || 'info')}"></span>${esc(f.title)}</div>
    ${f.detail ? `<div class="why">${esc(f.detail)}</div>` : ''}
    ${f.source ? `<div class="src">Как посчитано: ${esc(f.source)}</div>` : ''}
  </div>`;
}

function dirHTML(dir){
  return DIR_SECTIONS.map(([key, cls, label, blank]) => {
    const items = (dir && dir[key]) || [];
    const tag = `<span class="tag ${cls}">${label}</span>`;
    if (!items.length){
      // Пусто по двум разным причинам: данных мало (молчим честно) или
      // выводов действительно нет (это тоже вывод). Путать их нельзя.
      const line = dir && dir.ready ? blank : 'Недостаточно данных для вывода.';
      return `<div class="slot void">${tag}<div class="line">${esc(line)}</div></div>`;
    }
    const rows = items.slice(0, 3).map(findingHTML).join('');
    const rest = items.length > 3
      ? `<a class="more" href="${esc(items[3].href || 'finance.html')}">ещё ${items.length - 3} →</a>`
      : '';
    return `<div class="slot">${tag}${rows}${rest}</div>`;
  }).join('');
}

// ── KPI (запасной вид, если Директор не собрался) ──
function kpiHTML(d){
  const m = d.money || {}, o = d.orders || {}, cl = d.clients || {};

  const clientsSub = cl.total
    ? `<span class="s">из ${num(cl.total)} в базе${cl.new ? ` · ${num(cl.new)} ${plural(cl.new,'новый','новых','новых')} за 30 дней` : ''}</span>`
    : '<span class="s">клиенты появятся с первым обращением</span>';

  const ordersSub = o.total
    ? `<span class="s">всего ${num(o.total)}${o.today ? ` · сегодня ${num(o.today)}` : ''}</span>`
    : '<span class="s">заявок пока нет</span>';

  return [
    `<a class="v-kpi-card" href="finance.html">
       <span class="k">Доход · 30 дней</span>
       <span class="v num">${money(m.income)}</span>
       ${chg(m.income_change, m.income)}</a>`,
    `<a class="v-kpi-card" href="finance.html">
       <span class="k">Прибыль · 30 дней</span>
       <span class="v num">${money(m.profit)}</span>
       ${chg(m.profit_change, m.income || m.profit)}</a>`,
    `<a class="v-kpi-card" href="orders.html">
       <span class="k">Новые заявки</span>
       <span class="v num">${num(o.new)}</span>
       ${ordersSub}</a>`,
    `<a class="v-kpi-card" href="clients.html">
       <span class="k">Активные клиенты · 30 дней</span>
       <span class="v num">${num(cl.active)}</span>
       ${clientsSub}</a>`,
  ].join('');
}

// ── «Что говорит VELOR»: четыре мысли. Пустой слот честно говорит, что пусто ──
const SLOT_META = [
  ['observation',    'obs',  'Наблюдение',   'Пока не за чем наблюдать — данных мало.'],
  ['problem',        'prob', 'Проблема',     'Проблем не вижу. Это хорошая новость.'],
  ['recommendation', 'rec',  'Рекомендация', 'Отдельной рекомендации нет — сейчас всё идёт своим ходом.'],
  ['opportunity',    'opp',  'Возможность',  'Возможности появятся, когда наберётся история.'],
];

function slotsHTML(d){
  const v = d.velor || {};
  return SLOT_META.map(([key, cls, label, blank]) => {
    const s = v[key];
    if (!s) return `<div class="slot void">
        <span class="tag ${cls}">${label}</span>
        <div class="line">${esc(blank)}</div></div>`;
    const tag = `<span class="tag ${cls}">${label}</span>`;
    const body = `<div class="line">${esc(s.text)}</div>` +
                 (s.note ? `<div class="why">${esc(s.note)}</div>` : '');
    return s.href
      ? `<a class="slot" href="${esc(s.href)}">${tag}${body}</a>`
      : `<div class="slot">${tag}${body}</div>`;
  }).join('');
}

// ── «Что требует внимания» ──
function attnHTML(d){
  const items = d.attention || [];
  const head = `<h2>Что требует внимания${items.length ? ` <span class="n num">${items.length}</span>` : ''}</h2>`;
  if (!items.length){
    return head + `<p class="v-empty">Ничего не горит. Все заявки разобраны, источники на связи —
      можно заняться развитием: <a href="opportunities.html">возможности →</a></p>`;
  }
  return head + items.map(i => {
    const body = `<span class="pin ${esc(i.level || 'info')}"></span>
      <span class="body">
        <span class="t">${esc(i.title)}</span>
        ${i.note ? `<span class="d">${esc(i.note)}</span>` : ''}
      </span>`;
    // Без адреса это не ссылка: пустой href выглядит кликабельным и никуда не ведёт.
    return i.href ? `<a class="v-row" href="${esc(i.href)}">${body}</a>`
                  : `<div class="v-row">${body}</div>`;
  }).join('');
}

// ── «Последние изменения» ──
function actsHTML(events, d){
  const list = (events.length ? events : (d.activity || [])).slice(0, 5);
  const head = '<h2>Последние изменения</h2>';
  if (!list.length){
    return head + `<p class="v-empty">Пока тихо. Как только появятся заявки, деньги или обращения —
      я запишу здесь каждое движение.</p>`;
  }
  return head + list.map(e => `
    <div class="v-row">
      <span class="pin evt"></span>
      <span class="body">
        <span class="t">${esc(e.title)}</span>
        ${e.detail ? `<span class="d">${esc(e.detail)}</span>` : ''}
      </span>
      <span class="w">${esc(ago(e.created_at))}</span>
    </div>`).join('') + '<a class="more" href="timeline.html">Вся история →</a>';
}

// ── отрисовка без мигания: неизменившийся блок не трогаем совсем ──
const _last = {};
function put(id, html, animate){
  if (_last[id] === html) return;
  const first = _last[id] === undefined;
  _last[id] = html;
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = html;
  if (first && animate) el.querySelectorAll(':scope > *').forEach((n, i) => {
    n.classList.add('v-in'); n.style.animationDelay = Math.min(i, 8) * 55 + 'ms';
  });
}

function softText(el, text){
  if (!el || el.textContent === text) return;
  el.style.transition = 'opacity .35s ease';
  el.style.opacity = '0';
  setTimeout(()=>{ el.textContent = text; el.style.opacity = '1'; }, 200);
}

// «Пока вас не было» — одна строка под заголовком блока VELOR.
function saysSubText(aiEvents){
  const since = Date.now() - 14 * 3600 * 1000;
  const fresh = aiEvents.filter(e=>{
    const t = new Date((e.created_at || '').replace(' ', 'T') + 'Z');
    return !isNaN(t) && t.getTime() >= since;
  }).length;
  return fresh
    ? `Пока вас не было, я ${fresh} ${plural(fresh,'раз','раза','раз')} пересматривал ваши цифры.`
    : 'Смотрю на ваши цифры постоянно — вот что вижу сейчас.';
}

// На чём стоит вся сводка и чего посчитать не удалось. Это не мелкий шрифт
// для приличия: границы выводов владелец должен видеть рядом с выводами.
function paintBasis(dir){
  const basis = document.getElementById('basis');
  const gaps  = document.getElementById('gaps');
  if (!dir){ basis.textContent = ''; gaps.innerHTML = ''; return; }
  // Пока считать нечего, рассказывать про окна сравнения незачем.
  basis.innerHTML = `<b>${esc(dir.why || '')}</b>` +
    (dir.ready && dir.days
      ? ` Период: последние ${dir.days} дней, сравнение с предыдущими ${dir.days}.` : '');
  gaps.innerHTML = (dir.gaps || []).slice(0, 3)
    .map(g => `<div class="g">${esc(g)}</div>`).join('');
}

function showFail(){
  document.getElementById('failZone').innerHTML = `
    <div class="v-fail">
      <div>
        <div class="t">Не удалось получить данные</div>
        <div class="d">Сервер не отвечает. Показатели ниже могут быть устаревшими.</div>
      </div>
      <button class="v-btn" type="button" id="retry">Повторить</button>
    </div>`;
  document.getElementById('retry').onclick = () => {
    document.getElementById('failZone').innerHTML = '';
    load();
  };
}

let _lastAiId = null;

async function load(){
  let d;
  try{
    const r = await fetch('/api/home');
    if (!r.ok) throw new Error(r.status);
    d = await r.json();
  }catch{
    showFail();
    return;
  }
  document.getElementById('failZone').innerHTML = '';

  if (d.business && d.business.ai_name)
    document.getElementById('pulse').textContent = d.business.ai_name + ' на связи';

  document.getElementById('status').innerHTML = statusLine(d);
  // Директор — основной вид главной. Не собрался (старый сервер, сбой) —
  // показываем прежние показатели, но не выдумываем разбор.
  const dir = d.director;
  put('kpi', dir ? briefHTML(dir) : kpiHTML(d), true);
  put('slots', dir ? dirHTML(dir) : slotsHTML(d), true);
  paintBasis(dir);
  put('attnPanel', attnHTML(d), false);

  // Лента — отдельным запросом: она нужна только нижнему блоку и не должна
  // задерживать цифры наверху.
  let events = [];
  try{
    const t = await (await fetch('/api/timeline?limit=40')).json();
    events = t.events || [];
  }catch{ /* лента не критична: покажем то, что пришло в /api/home */ }

  const AI_KINDS = new Set(['reply','risk','opportunity','idea','board','content','memory','plan']);
  const aiEvents = events.filter(e => AI_KINDS.has(e.kind));
  softText(document.getElementById('saysSub'), saysSubText(aiEvents));
  put('actsPanel', actsHTML(events, d), false);

  // Живое ядро реагирует только на настоящую новую работу AI, не на каждый опрос.
  const maxAiId = aiEvents.reduce((m, e) => Math.max(m, e.id || 0), 0);
  if (_lastAiId !== null && maxAiId > _lastAiId && window.VELOR_CORE){
    window.VELOR_CORE.setState('analyzing');
    window.VELOR_CORE.insight();
    setTimeout(()=>{ if (window.VELOR_CORE) window.VELOR_CORE.setState('idle'); }, 2600);
  }
  _lastAiId = maxAiId;
}

load();
setInterval(load, 30000);
</script>

<style>
  /* ── Trial: запуск / режим ожидания / ценность ── */
  #trialZone:empty{ display:none; }
  #trialZone{ margin:0 0 var(--sp-5); }
  .tz-launch, .tz-locked{ border-radius:var(--r-xl); padding:30px 34px;
    border:1px solid rgba(128,82,255,.3); animation:velorIn .5s var(--ease) both;
    background:linear-gradient(150deg,rgba(128,82,255,.18),rgba(91,108,255,.05) 60%,rgba(255,255,255,.015)); }
  .tz-launch h3, .tz-locked h3{ font-weight:500; font-size:clamp(22px,2.6vw,28px); letter-spacing:-.02em; }
  .tz-launch p, .tz-locked p{ color:var(--silver); font-weight:200; font-size:var(--fs-body);
    line-height:1.55; margin-top:8px; max-width:640px; }
  .tz-steps{ display:flex; gap:var(--sp-4); flex-wrap:wrap; margin:18px 0 6px; font-size:13.5px; color:var(--ash); }
  .tz-steps span{ display:inline-flex; align-items:center; gap:7px; }
  .tz-steps span.ok{ color:var(--verdant); }
  .tz-go{ display:inline-flex; align-items:center; gap:9px; margin-top:var(--sp-5); min-height:48px;
    padding:14px 28px; border-radius:var(--r-sm); border:none; background:var(--iris); color:#fff;
    font-family:inherit; font-weight:600; font-size:var(--fs-body); cursor:pointer; transition:filter .2s; }
  .tz-go:hover{ filter:brightness(1.16) drop-shadow(0 0 18px rgba(128,82,255,.55)); }
  .tz-go:disabled{ opacity:.5; cursor:default; filter:none; }
  .tz-msg{ margin-top:var(--sp-3); font-size:var(--fs-body); color:var(--saffron); }
  .tz-msg a{ color:var(--lilac); }
  .tz-locked{ border-color:rgba(255,255,255,.12); background:linear-gradient(150deg,rgba(128,82,255,.14),rgba(255,255,255,.02)); }
  .tz-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:var(--sp-3); margin:var(--sp-5) 0; }
  .tz-stats div{ border:1px solid var(--hairline); border-radius:var(--r-md); padding:14px 16px; }
  .tz-stats .n{ font-weight:400; font-size:24px; letter-spacing:-.02em; color:#c9bfff; }
  .tz-stats .k{ font-size:var(--fs-caption); color:var(--ash); margin-top:3px; }
  .tz-strip{ display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap; padding:12px 18px;
    border-radius:var(--r-md); border:1px solid var(--hairline); background:var(--surface);
    font-size:13.5px; color:var(--silver); }
  .tz-strip b{ color:#c9bfff; font-weight:500; } .tz-strip .d{ margin-left:auto; color:var(--ash); }
</style>
<script>
(function(){
  if (!localStorage.getItem('coreon_biz_token')) return;
  var z = document.getElementById('trialZone');
  fetch('/api/trial').then(function(r){ return r.ok ? r.json() : null; }).then(function(t){
    if (!t || !z) return;
    if (t.needs_launch) return renderLaunch(t);
    if (t.read_only)    return renderLocked(t);
    if (t.phase === 'trial') return renderTrial(t);
  }).catch(function(){});

  function renderLaunch(t){
    z.innerHTML =
      '<div class="tz-launch">' +
        '<h3>Запустите VELOR</h3>' +
        '<p>После запуска у вас <b style="color:#fff">14 дней полного доступа</b> ко всем возможностям. ' +
        'Сначала подключите Telegram и наполните базу знаний — так пробный период пройдёт с максимальной пользой.</p>' +
        '<div class="tz-steps">' +
          '<span>① Подключить Telegram</span><span>② Загрузить базу знаний</span><span>③ Запустить отсчёт</span>' +
        '</div>' +
        '<button class="tz-go" id="tzGo">Запустить VELOR →</button>' +
        '<div class="tz-msg" id="tzMsg"></div>' +
      '</div>';
    document.getElementById('tzGo').onclick = function(){
      var btn = this, msg = document.getElementById('tzMsg');
      btn.disabled = true; msg.textContent = 'Запускаю…';
      fetch('/api/trial/start', { method:'POST' }).then(function(r){
        return r.json().then(function(d){ return { ok:r.ok, d:d }; });
      }).then(function(res){
        if (res.ok){ msg.style.color = 'var(--verdant)'; msg.textContent = 'Готово! Пробный период на 14 дней запущен.';
          setTimeout(function(){ location.reload(); }, 900); }
        else if (res.d && res.d.needs_verify){
          btn.style.display = 'none';
          var bot = res.d.bot ? ('@' + res.d.bot) : 'вашего бота';
          msg.style.color = '';
          msg.innerHTML =
            '<div style="text-align:left;line-height:1.6">' +
            '<b style="color:#fff">Подтвердите, что вы владелец</b><br>' +
            'Триал привязывается к вам лично, а не к боту — поэтому создать новый бот ' +
            'ради нового триала не выйдет.<br><br>' +
            '1. Откройте своего бота <b style="color:#fff">' + bot + '</b> в Telegram.<br>' +
            '2. Отправьте ему код:<br>' +
            '<span style="display:inline-block;margin:8px 0;font-size:26px;letter-spacing:6px;' +
            'font-weight:700;color:var(--lilac)">' + (res.d.code||'') + '</span><br>' +
            '3. Вернитесь сюда и нажмите кнопку ниже.' +
            '<div style="margin-top:12px"><button class="tz-go" id="tzConfirm">Я подтвердил — запустить →</button></div>' +
            '</div>';
          document.getElementById('tzConfirm').onclick = function(){ btn.onclick.call(btn); };
          btn.disabled = false;
        }
        else {
          btn.disabled = false;
          if (res.d.detail && res.d.detail.indexOf('Telegram-бота') >= 0)
            msg.innerHTML = res.d.detail + ' <a href="guide.html">Подключить →</a>';
          else msg.textContent = res.d.detail || 'Не удалось запустить.';
        }
      }).catch(function(){ btn.disabled = false; msg.textContent = 'Сервер не отвечает.'; });
    };
  }

  function renderLocked(t){
    var s = t.stats || {};
    z.innerHTML =
      '<div class="tz-locked">' +
        '<h3>Ваш AI ждёт возвращения</h3>' +
        '<p>Пробный период завершён. Все данные сохранены — вы в режиме просмотра. ' +
        'Продолжите работу, выбрав подходящий тариф.</p>' +
        '<div class="tz-stats">' +
          stat(s.messages, 'сообщений обработал') +
          stat(s.orders, 'заявок создал') +
          stat(s.clients, 'клиентов в базе') +
          stat(s.recommendations, 'рекомендаций') +
          stat(s.hours_saved, 'часов сэкономил') +
        '</div>' +
        '<a class="tz-go" href="plans.html">Выбрать тариф →</a>' +
      '</div>';
  }

  function renderTrial(t){
    var s = t.stats || {}, dl = t.days_left;
    var left = (dl === 0) ? 'менее суток' : (dl + ' ' + plural2(dl, 'день','дня','дней'));
    z.innerHTML =
      '<div class="tz-strip">' +
        '<span>Пробный период: <b>' + left + '</b> осталось</span>' +
        '<span>VELOR уже: <b>' + (s.messages||0) + '</b> сообщений · <b>' + (s.orders||0) + '</b> заявок · <b>' + (s.clients||0) + '</b> клиентов</span>' +
        '<a class="d" href="plans.html" style="color:var(--lilac)">Тарифы →</a>' +
      '</div>';
  }

  function stat(n, k){ return '<div><div class="n num">' + (n||0) + '</div><div class="k">' + k + '</div></div>'; }
  function plural2(n, a, b, c){ var n10=n%10, n100=n%100;
    if (n10===1 && n100!==11) return a;
    if (n10>=2 && n10<=4 && !(n100>=12 && n100<=14)) return b; return c; }
})();
</script>
