<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELOR AI — Журнал ошибок</title>
<link href="vendor/inter.css" rel="stylesheet">
<style>
  :root{
    --void:#000; --bone:#fff; --ash:#9a9a9a; --silver:#bdbdbd;
    --iris:#8052ff; --saffron:#ffb829; --verdant:#2fd4b2; --coral:#ff6b6b; --magenta:#ff4fd8;
    --hairline:rgba(255,255,255,.08); --surface:rgba(255,255,255,.04);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--void); color:var(--bone); font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    font-weight:200; font-size:16px; line-height:1.5; overflow-x:hidden; min-height:100dvh; }
  ::selection{ background:rgba(128,82,255,.4); color:#fff; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--iris); outline-offset:3px; border-radius:6px; }
  .num{ font-variant-numeric:tabular-nums; }

  nav{ position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:18px 24px; background:linear-gradient(180deg,rgba(0,0,0,.92),transparent); }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:400; font-size:18px; letter-spacing:.14em; }
  .nav-links{ display:flex; gap:20px; align-items:center; }
  .ghost{ font-weight:400; font-size:13px; letter-spacing:.3px; text-transform:uppercase; color:var(--ash);
    background:none; border:none; transition:color .25s; min-height:44px; display:inline-flex; align-items:center; }
  .ghost:hover{ color:var(--bone); }

  main{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:104px 24px 80px; }
  .label{ font-weight:600; font-size:13px; letter-spacing:.35px; text-transform:uppercase; color:var(--saffron); }
  h1{ font-weight:400; font-size:clamp(30px,5vw,52px); line-height:1.1; letter-spacing:-0.04em; margin:12px 0 8px; }
  .sub{ color:var(--ash); font-size:14px; margin-bottom:36px; }

  /* панель фильтров */
  .filters{ display:grid; grid-template-columns:1fr auto auto auto; gap:14px; align-items:end; margin-bottom:14px; }
  @media(max-width:760px){ .filters{ grid-template-columns:1fr 1fr; } .f-search{ grid-column:1 / -1; } }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--ash); font-weight:600; }
  input, select{ min-height:46px; background:var(--surface); border:1px solid var(--hairline); border-radius:12px;
    padding:10px 14px; color:var(--bone); font-family:inherit; font-weight:200; font-size:16px;
    transition:border-color .25s, box-shadow .25s; }
  input:focus, select:focus{ border-color:var(--iris); box-shadow:0 0 16px rgba(128,82,255,.25); outline:none; }
  select{ cursor:pointer; }
  input[type=date]{ color-scheme:dark; }
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:24px; }
  .count{ font-size:13px; color:var(--ash); }
  .count b{ color:var(--bone); font-weight:400; }
  .actions{ display:flex; gap:10px; }
  .pill{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 20px; border-radius:24px;
    background:var(--iris); color:#fff; border:none; font-weight:600; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; transition:filter .25s; }
  .pill:hover{ filter:brightness(1.18) drop-shadow(0 0 16px rgba(128,82,255,.45)); }
  .pill.sec{ background:var(--surface); color:var(--silver); border:1px solid var(--hairline); }
  .pill.sec:hover{ filter:none; color:var(--bone); border-color:var(--iris); }
  .pill:disabled{ opacity:.4; cursor:default; filter:none; }

  /* список записей */
  .rows{ border-top:1px solid var(--hairline); }
  .entry{ border-bottom:1px solid var(--hairline); }
  .entry > .head{ width:100%; text-align:left; background:none; border:none; color:inherit; display:grid;
    grid-template-columns:auto auto 1fr auto; gap:16px; align-items:center; padding:18px 6px; transition:background .25s, padding-left .25s; }
  .entry > .head:hover{ background:linear-gradient(90deg,rgba(128,82,255,.07),transparent 70%); padding-left:14px; }
  @media(max-width:760px){ .entry > .head{ grid-template-columns:auto 1fr auto; gap:10px; } .ts{ display:none; } }
  .badge{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px;
    border-radius:8px; white-space:nowrap; }
  .badge.WARNING{ color:var(--saffron); background:rgba(255,184,41,.12); }
  .badge.ERROR{ color:var(--coral); background:rgba(255,107,107,.14); }
  .badge.CRITICAL{ color:#fff; background:var(--coral); }
  .badge.INFO{ color:var(--verdant); background:rgba(47,212,178,.12); }
  .badge.DEBUG{ color:var(--silver); background:rgba(255,255,255,.06); }
  .ts{ font-size:13px; color:var(--ash); white-space:nowrap; }
  .msg{ font-size:15px; font-weight:200; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chev{ color:var(--ash); transition:transform .25s; flex:none; }
  .entry.open .chev{ transform:rotate(90deg); }
  .full{ display:none; padding:0 6px 20px; }
  .entry.open .full{ display:block; }
  .full pre{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; line-height:1.6; font-weight:400;
    background:#0b0b0d; border:1px solid var(--hairline); border-radius:12px; padding:16px; color:var(--silver);
    overflow-x:auto; white-space:pre; }

  /* состояния */
  .state{ padding:60px 20px; text-align:center; color:var(--ash); }
  .state svg{ opacity:.5; margin-bottom:16px; }
  .state h3{ font-weight:400; font-size:20px; color:var(--bone); margin-bottom:6px; }
  .sk{ height:60px; border-bottom:1px solid var(--hairline); position:relative; overflow:hidden; }
  .sk::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
    transform:translateX(-100%); animation:sh 1.4s infinite; }
  @keyframes sh{ to{ transform:translateX(100%); } }
  @media(prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

  #toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); z-index:100;
    background:#141416; border:1px solid var(--hairline); border-radius:12px; padding:12px 20px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<nav>
  <a href="admin.html" class="logo"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1 L17 16 L1 16 Z" fill="#8052ff"/></svg>VELOR AI</a>
  <div class="nav-links">
    <a class="ghost" href="admin.html">← Кабинет</a>
    <button class="ghost" id="logout">Выйти</button>
  </div>
</nav>

<main>
  <span class="label">// Кабинет владельца</span>
  <h1>Журнал ошибок.</h1>
  <p class="sub">Что записал сервер в errors.log — сбои, предупреждения и трассировки.</p>

  <div class="filters">
    <div class="field f-search">
      <label for="q">Поиск по тексту</label>
      <input id="q" type="search" placeholder="слово, endpoint, текст ошибки…" autocomplete="off">
    </div>
    <div class="field">
      <label for="date">Дата</label>
      <input id="date" type="date">
    </div>
    <div class="field">
      <label for="level">Уровень</label>
      <select id="level"><option value="">Любой</option></select>
    </div>
    <div class="field">
      <label aria-hidden="true">&nbsp;</label>
      <button class="pill sec" id="reset" type="button">Сбросить</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="count" id="count" role="status" aria-live="polite">Загрузка…</div>
    <div class="actions">
      <button class="pill sec" id="refresh" type="button">Обновить</button>
      <button class="pill" id="download" type="button">Скачать лог</button>
    </div>
  </div>

  <div id="list" class="rows"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
if (!localStorage.getItem('coreon_token')) location.replace('login.html');
const H = () => ({ 'Content-Type':'application/json', 'X-Auth': localStorage.getItem('coreon_token') });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3000); }

function goLogin(){ localStorage.removeItem('coreon_token'); localStorage.removeItem('coreon_refresh'); location.replace('login.html'); }
document.getElementById('logout').onclick = () => {
  const rt = localStorage.getItem('coreon_refresh');
  fetch('/api/logout', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ refresh_token: rt || '' }) })
    .catch(()=>{}).then(goLogin);
};
async function refreshAccess(){
  const rt = localStorage.getItem('coreon_refresh');
  if (!rt) return false;
  const r = await fetch('/api/refresh', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ refresh_token: rt }) });
  if (!r.ok) return false;
  const d = await r.json();
  if (!d.token) return false;
  localStorage.setItem('coreon_token', d.token);
  return true;
}
async function apiRaw(url, opts={}){
  let r = await fetch(url, { headers:H(), ...opts });
  if (r.status === 401){
    if (await refreshAccess()) r = await fetch(url, { headers:H(), ...opts });
    else { goLogin(); throw new Error('auth'); }
    if (r.status === 401){ goLogin(); throw new Error('auth'); }
  }
  return r;
}
async function api(url, opts={}){ return (await apiRaw(url, opts)).json(); }

const fmtSize = n => n < 1024 ? n+' Б' : n < 1048576 ? (n/1024).toFixed(1)+' КБ' : (n/1048576).toFixed(1)+' МБ';

const qEl = document.getElementById('q'), dateEl = document.getElementById('date'),
      levelEl = document.getElementById('level'), listEl = document.getElementById('list'),
      countEl = document.getElementById('count');
let knownLevels = [];

function stateBlock(icon, title, text){
  return `<div class="state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${icon}</svg><h3>${esc(title)}</h3><div>${esc(text)}</div></div>`;
}

function render(data){
  // уровни в фильтр (один раз, чтобы не сбрасывать выбор)
  if (data.levels && data.levels.join() !== knownLevels.join()){
    knownLevels = data.levels;
    const cur = levelEl.value;
    levelEl.innerHTML = '<option value="">Любой</option>' + data.levels.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
    levelEl.value = cur;
  }
  const items = data.items || [];
  if (!data.exists){
    countEl.textContent = 'Журнал пуст';
    listEl.className = ''; listEl.innerHTML = stateBlock('<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>', 'Пока пусто', 'Файл errors.log ещё не создан — значит, ошибок не было.');
    document.getElementById('download').disabled = true;
    return;
  }
  document.getElementById('download').disabled = false;
  countEl.innerHTML = `Показано <b>${items.length}</b> из <b>${data.total}</b> · размер файла ${fmtSize(data.size)}`;
  if (!items.length){
    listEl.className = ''; listEl.innerHTML = stateBlock('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', 'Ничего не найдено', 'Под фильтры ничего не подошло. Попробуйте изменить дату, уровень или поиск.');
    return;
  }
  listEl.className = 'rows';
  listEl.innerHTML = items.map((e,i)=>{
    const lvl = ['WARNING','ERROR','CRITICAL','INFO','DEBUG'].includes(e.level) ? e.level : 'INFO';
    return `<div class="entry" data-i="${i}">
      <button class="head" aria-expanded="false">
        <span class="badge ${lvl}">${esc(e.level)}</span>
        <span class="ts num">${esc(e.ts)}</span>
        <span class="msg">${esc(e.message)}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="full"><pre>${esc(e.full)}</pre></div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.entry .head').forEach(btn=>{
    btn.onclick = ()=>{ const en = btn.closest('.entry'); const op = en.classList.toggle('open'); btn.setAttribute('aria-expanded', op); };
  });
}

let reqId = 0;
async function load(){
  const my = ++reqId;
  const p = new URLSearchParams();
  if (qEl.value.trim()) p.set('q', qEl.value.trim());
  if (dateEl.value) p.set('date', dateEl.value);
  if (levelEl.value) p.set('level', levelEl.value);
  try{
    const data = await api('/api/admin/errors?' + p.toString());
    if (my !== reqId) return;   // пришёл устаревший ответ — игнорируем
    render(data);
  }catch(e){
    if (e.message === 'auth') return;
    listEl.className=''; listEl.innerHTML = stateBlock('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>', 'Сервер не отвечает', 'Не удалось получить журнал. Запущен ли server.py?');
    countEl.textContent = 'Ошибка загрузки';
  }
}

let deb;
qEl.addEventListener('input', ()=>{ clearTimeout(deb); deb=setTimeout(load, 250); });
dateEl.addEventListener('change', load);
levelEl.addEventListener('change', load);
document.getElementById('refresh').onclick = load;
document.getElementById('reset').onclick = ()=>{ qEl.value=''; dateEl.value=''; levelEl.value=''; load(); };

// скачивание через blob — токен уходит заголовком, а не в URL
document.getElementById('download').onclick = async ()=>{
  const btn = document.getElementById('download'); btn.disabled = true;
  try{
    const r = await apiRaw('/api/admin/errors/download');
    if (!r.ok) throw new Error('dl');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'errors.log'; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
    toast('Файл журнала скачан');
  }catch(e){ if(e.message!=='auth') toast('Не удалось скачать файл'); }
  btn.disabled = false;
};

load();
</script>
</body>
</html>
