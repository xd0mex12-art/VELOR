# ── Render Blueprint для VELOR ────────────────────────────────────────────────
# Развёртывание: залейте проект в GitHub → на render.com «New +» → «Blueprint» →
# выберите репозиторий. Render прочитает этот файл и создаст бесплатный веб-сервис
# с автоматическим HTTPS. Секреты (пароль владельца, ключ GigaChat) вводятся в
# панели Render — в коде и в git их нет.
#
# ВАЖНО про бесплатный тариф: диск эфемерный — база SQLite сбрасывается при
# передеплое, а сервис засыпает после ~15 минут простоя (первый запрос будит его
# ~30 сек). Это ок, чтобы показать продукт и начать продавать; для боевых данных
# клиента позже переедем на тариф с постоянным диском или на Fly.io.

services:
  - type: web
    name: velor
    runtime: python
    plan: free
    region: frankfurt          # ближе к РФ, чем США; при желании поменяйте
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    autoDeploy: true           # каждый git push — автоматический передеплой
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      # Прод-режим: сервер откажется стартовать со слабым паролем владельца —
      # это защита, а не каприз. Задайте надёжный OWNER_PASSWORD ниже.
      - key: APP_ENV
        value: production
      # Логин и пароль владельца (админки). Впишите в панели Render → Environment.
      - key: OWNER_LOGIN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Секрет подписи сессий — Render сгенерирует сам и сохранит постоянным
      # (иначе на бесплатном диске он бы обнулялся при рестарте и всех разлогинивало).
      - key: JWT_SECRET
        generateValue: true
      # ОСНОВНОЙ провайдер ИИ — Google Gemini (если задан ключ). GigaChat ниже —
      # страховка с автооткатом. Ключ вставляете сами в панели Render. Для
      # реселлера/прокси задайте их OpenAI-совместимый URL в GEMINI_BASE_URL.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BASE_URL
        sync: false
      # Ключ ИИ (GigaChat / Сбер) — страховка/запасной. Вставляете сами в Render.
      - key: GIGACHAT_AUTH_KEY
        sync: false
      # ПОСТОЯННОЕ ХРАНИЛИЩЕ (обязательно для реальных клиентов). Пока DATABASE_URL
      # не задан — приложение пишет SQLite в рабочую папку, которая на free-тарифе
      # ЭФЕМЕРНА и стирается при каждом передеплое (годится только для демо).
      # Впишите строку подключения Postgres (Supabase → Project Settings → Database →
      # Connection string → Transaction pooler) в панели Render → Environment.
      # Формат: postgresql://USER:PASSWORD@HOST:6543/postgres
      - key: DATABASE_URL
        sync: false
      # DB_PATH и LOG_DIR не задаём — приложение пишет логи в свою рабочую папку.
      # Когда задан DATABASE_URL, данные живут в Postgres и передеплой их не трогает.
