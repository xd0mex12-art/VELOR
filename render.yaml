# ── Render Blueprint для VELOR ────────────────────────────────────────────────
# Развёртывание: залейте проект в GitHub → на render.com «New +» → «Blueprint» →
# выберите репозиторий. Render прочитает этот файл и создаст бесплатный веб-сервис
# с автоматическим HTTPS. Секреты (пароль владельца, ключ GigaChat) вводятся в
# панели Render — в коде и в git их нет.
#
# ВАЖНО про бесплатный тариф: диск эфемерный — база SQLite сбрасывается при
# передеплое, а сервис засыпает после ~15 минут простоя (первый запрос будит его
# ~30 сек). Это ок, чтобы показать продукт и начать продавать; для боевых данных
# клиента позже переедем на тариф с постоянным диском или на Fly.io.

services:
  - type: web
    name: velor
    runtime: python
    plan: free
    region: frankfurt          # ближе к РФ, чем США; при желании поменяйте
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    autoDeploy: true           # каждый git push — автоматический передеплой
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      # Прод-режим: сервер откажется стартовать со слабым паролем владельца —
      # это защита, а не каприз. Задайте надёжный OWNER_PASSWORD ниже.
      - key: APP_ENV
        value: production
      # Логин и пароль владельца (админки). Впишите в панели Render → Environment.
      - key: OWNER_LOGIN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Секрет подписи сессий — Render сгенерирует сам и сохранит постоянным
      # (иначе на бесплатном диске он бы обнулялся при рестарте и всех разлогинивало).
      - key: JWT_SECRET
        generateValue: true
      # Логин ВАШЕГО собственного бизнеса внутри VELOR. Аккаунт с этим логином
      # при входе получает полномочия владельца вдобавок к своему кабинету:
      # свой брифинг и свои заявки как у всех, плюс список клиентов рядом.
      # Отдельной админки и отдельного входа больше нет.
      #
      # Почему здесь, а не в базе: право видеть чужие данные не должно
      # выдаваться ничем, до чего дотягивается само приложение. Пока переменная
      # пуста, полномочий не получает никто — поведение продукта обычное.
      - key: OWNER_BUSINESS_LOGIN
        sync: false
      # Ключ, которым шифруются ключи ЧУЖИХ сервисов (Ozon, ЮKassa, amoCRM).
      # Пароли мы храним хешем, а эти читаем обратно на каждую синхронизацию —
      # значит только шифрование. Здесь НЕ generateValue: смена ключа делает
      # сохранённые ключи нечитаемыми, и владельцу придётся вводить их заново.
      # Пока не задан, secretbox берёт материал из JWT_SECRET — то есть задать
      # его бесплатно можно ровно до первого подключённого источника, а потом
      # уже нет. Впишите значение в панели Render один раз и не меняйте.
      - key: SECRET_KEY
        sync: false
      # ОСНОВНОЙ провайдер ИИ — Google Gemini (если задан ключ). GigaChat ниже —
      # страховка с автооткатом. Ключ вставляете сами в панели Render. Для
      # реселлера/прокси задайте их OpenAI-совместимый URL в GEMINI_BASE_URL.
      - key: GEMINI_API_KEY
        sync: false
      # Имя модели зависит от провайдера/реселлера (напр. у tokenn.pro —
      # gemini-3.5-flash), поэтому задаётся в панели, а не жёстко в блупринте.
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_BASE_URL
        sync: false
      # Ключ ИИ (GigaChat / Сбер) — страховка/запасной. Вставляете сами в Render.
      - key: GIGACHAT_AUTH_KEY
        sync: false
      # ── Instagram (директ как канал продаж) ───────────────────────────────
      # Приложение в Meta одно на всех клиентов VELOR, ключи к нему живут здесь.
      # Пока их нет, кнопка «Подключить» в кабинете честно не работает и прямо
      # говорит, чего не хватает, — фальшивый экран входа хуже пустого места.
      #
      # Где взять: developers.facebook.com → создать приложение → продукт
      # «Instagram» → сборка «Instagram API with Instagram Login». В настройках
      # приложения впишите четыре адреса, которые кабинет показывает на странице
      # instagram.html: возврата, вебхука, отключения и запроса на удаление.
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      # Свой домен сервиса. Из него собираются все четыре адреса выше. Если не
      # задан, берётся RENDER_EXTERNAL_URL, который Render подставляет сам.
      - key: PUBLIC_URL
        sync: false
      # ПОСТОЯННОЕ ХРАНИЛИЩЕ (обязательно для реальных клиентов). Пока DATABASE_URL
      # не задан — приложение пишет SQLite в рабочую папку, которая на free-тарифе
      # ЭФЕМЕРНА и стирается при каждом передеплое (годится только для демо).
      # Впишите строку подключения Postgres (Supabase → Project Settings → Database →
      # Connection string → Transaction pooler) в панели Render → Environment.
      # Формат: postgresql://USER:PASSWORD@HOST:6543/postgres
      - key: DATABASE_URL
        sync: false
      # DB_PATH и LOG_DIR не задаём — приложение пишет логи в свою рабочую папку.
      # Когда задан DATABASE_URL, данные живут в Postgres и передеплой их не трогает.
